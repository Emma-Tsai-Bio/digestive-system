<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人體地下城：消化魔法使的考驗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   主題色彩
   ========================================================= */
:root{
  --bg0:#0d0a0e;
  --panel:#1f181b;
  --panel2:#2a2124;
  --stone:#352a2c;
  --line:rgba(217,178,95,0.38);
  --gold:#d9b25f;
  --gold-hi:#f3dc9c;
  --gold-dark:#7a5718;
  --text:#efe4cc;
  --muted:#a8977c;
  --red:#e0574f;
  --green:#4cc38a;
  --blue:#6f9cff;
  --purple:#b07cff;
  --radius:14px;
  --trgb:217,178,95; /* 關卡主題色（RGB），由 JS 依關卡切換 */
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
button,.opt-btn,.match-opt,.chk-pill,.diff-card{touch-action:manipulation;}
body{
  min-height:100vh;
  color:var(--text);
  font-family:'Noto Sans TC',sans-serif;
  padding:18px 14px 60px;
  -webkit-font-smoothing:antialiased;
  background-color:var(--bg0);
  background-image:
    linear-gradient(rgba(10,7,11,var(--dim-top,0.84)), rgba(10,7,11,var(--dim-bottom,0.93))),
    var(--bgimg, none),
    radial-gradient(ellipse at 15% -10%, rgba(176,124,255,0.12), transparent 55%),
    radial-gradient(ellipse at 90% 0%, rgba(217,178,95,0.10), transparent 50%),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 46px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0 2px, transparent 2px 92px);
  background-size:auto, cover, auto, auto, auto, auto;
  background-position:center, center, center, center, center, center;
  background-attachment:fixed, fixed, scroll, scroll, scroll, scroll;
}
h1,h2,h3,h4{font-family:'Noto Serif TC',serif; margin:0;}
button{font-family:inherit; cursor:pointer;}
.wrap{max-width:1000px; margin:0 auto;}

/* ---------- 圖片占位（找不到圖片時顯示表情符號） ---------- */
.pic{display:inline-flex; align-items:center; justify-content:center; overflow:hidden; line-height:1;}
.pic img{width:100%; height:100%; object-fit:cover; display:block;}
.pic .pic-fb{display:none; width:100%; height:100%; align-items:center; justify-content:center;}
.pic.noimg img{display:none;}
.pic.noimg .pic-fb{display:flex;}

/* ---------- 版面 ---------- */
.game-layout{display:flex; gap:18px; align-items:flex-start;}
.map-col{flex:0 0 28%; max-width:290px; min-width:220px; position:sticky; top:14px;}
.content-col{flex:1; min-width:0; display:flex; flex-direction:column; gap:14px;}
@media(max-width:780px){
  .game-layout{flex-direction:column;}
  .map-col{flex:none; max-width:100%; width:100%; position:static; order:2;}
  .content-col{width:100%;}
}

/* ---------- RPG 面板框 ---------- */
.panel{
  position:relative;
  background:linear-gradient(180deg, var(--panel2), var(--panel));
  border:2px solid var(--line);
  border-radius:var(--radius);
  padding:22px 20px;
  box-shadow:0 0 0 1px rgba(0,0,0,0.7), inset 0 0 0 4px rgba(0,0,0,0.25), inset 0 0 0 5px rgba(217,178,95,0.12), 0 10px 30px rgba(0,0,0,0.45);
  animation:fadein .35s ease;
}
.panel::before,.panel::after{
  content:''; position:absolute; width:20px; height:20px; border:2px solid var(--gold); pointer-events:none; z-index:3;
}
.panel::before{top:7px; left:7px; border-right:none; border-bottom:none;}
.panel::after{bottom:7px; right:7px; border-left:none; border-top:none;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

/* ---------- 頂部列 ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-emblem{
  width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px;
  background:radial-gradient(circle, #3a2b1a, #150f0c); border:2px solid var(--gold); box-shadow:0 0 14px rgba(217,178,95,0.35);
}
.brand h1{font-size:21px; font-weight:900; letter-spacing:1px; color:var(--gold-hi); text-shadow:0 2px 0 #000, 0 0 12px rgba(217,178,95,0.35);}
.brand .sub{display:block; font-size:11.5px; color:var(--muted); margin-top:2px; letter-spacing:1px;}
.brand .en{font-family:'Cinzel',serif; font-size:10px; color:var(--gold); letter-spacing:3px; display:block;}
.hud{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.hearts{display:flex; gap:2px;}
.heart{font-size:18px; transition:transform .25s;}
.heart.empty{opacity:0.35; filter:grayscale(1);}
.heart.shake{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mana-chip{
  display:flex; align-items:center; gap:6px; background:rgba(0,0,0,0.45); border:1px solid var(--line);
  padding:6px 12px; border-radius:999px; font-weight:700; font-size:13px;
}
.mana-chip b{color:#ff9d5c; font-family:'Cinzel',serif; font-size:16px;}
.hud-btn{
  background:linear-gradient(180deg,#3b2d22,#22191a); color:var(--gold-hi); border:1px solid var(--line);
  border-radius:999px; padding:7px 14px; font-weight:700; font-size:13px;
}
.hud-btn:hover{border-color:var(--gold); box-shadow:0 0 10px rgba(217,178,95,0.3);}

/* ---------- 地圖 ---------- */
.map-panel{padding:16px 12px 14px;}
.map-title{font-size:12px; color:var(--gold); padding:0 6px 10px; font-weight:700; letter-spacing:2px; text-align:center; font-family:'Noto Serif TC',serif;}
.map-title small{display:block; font-family:'Cinzel',serif; font-size:9.5px; color:var(--muted); letter-spacing:3px;}
.diagram-wrap{position:relative; width:100%; line-height:0; border-radius:10px; overflow:hidden; border:1px solid var(--line); background:#efe7da; margin-bottom:12px;}
@media(max-width:780px){.diagram-wrap{max-width:260px; margin:0 auto 12px;}}
.diagram-img{width:100%; height:auto; display:block; filter:sepia(0.35) contrast(1.05);}
.organ-marker{
  position:absolute; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%; border:3px solid #1b1416;
  transition:background .35s, opacity .35s, box-shadow .35s;
}
.status-upcoming{background:#8b7d6b; opacity:0.55;}
.status-done{background:var(--green); opacity:0.95; box-shadow:0 0 0 3px rgba(76,195,138,0.3);}
.status-current{background:var(--red); box-shadow:0 0 0 7px rgba(224,87,79,0.35); animation:markerPulse 1.3s infinite;}
.status-active-gland{background:var(--gold); box-shadow:0 0 0 7px rgba(217,178,95,0.35); animation:markerPulse 1.3s infinite;}
@keyframes markerPulse{0%,100%{opacity:1;}50%{opacity:0.5;}}
.path-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px;}
@media(max-width:780px){.path-list{flex-direction:row; flex-wrap:wrap; justify-content:center;}}
.path-list li{
  display:flex; align-items:center; gap:8px; font-size:12.5px; padding:6px 10px; border-radius:8px;
  background:rgba(0,0,0,0.3); border:1px solid rgba(217,178,95,0.12); color:var(--muted);
}
.path-list li small{color:#7d6f5c; font-size:10.5px; margin-left:auto;}
.path-list li .dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
.path-list li.p-current{color:var(--text); border-color:rgba(224,87,79,0.6); background:rgba(224,87,79,0.12);}
.path-list li.p-done{color:#bfe8d2;}
.map-legend{display:flex; flex-wrap:wrap; gap:6px 12px; justify-content:center; margin-top:10px; font-size:10.5px; color:var(--muted);}
.legend-item{display:flex; align-items:center; gap:5px;}
.legend-dot{width:9px; height:9px; border-radius:50%; display:inline-block;}

/* ---------- 腸道大賢者（NPC） ---------- */
.wizard-bar{display:flex; align-items:flex-start; gap:12px; animation:fadein .35s ease;}
.wiz-avatar{
  width:76px; height:76px; border-radius:50%; flex-shrink:0; font-size:42px;
  background:radial-gradient(circle at 50% 35%, #3d2f5c, #120d1c); border:3px solid var(--gold);
  box-shadow:0 0 0 3px #120d0e, 0 0 18px rgba(176,124,255,0.45);
}
.wizard-bar.mood-happy .wiz-avatar{box-shadow:0 0 0 3px #120d0e, 0 0 20px rgba(76,195,138,0.6);}
.wizard-bar.mood-sad .wiz-avatar{box-shadow:0 0 0 3px #120d0e, 0 0 20px rgba(224,87,79,0.6);}
.wiz-bubble{
  position:relative; flex:1; background:linear-gradient(180deg,#efe2c2,#dcc79a); color:#2b1d10;
  border:2px solid #8c6a2a; border-radius:12px; padding:10px 14px; box-shadow:0 4px 0 rgba(0,0,0,0.4);
}
.wiz-bubble::before{
  content:''; position:absolute; left:-11px; top:24px; border:9px solid transparent; border-right-color:#8c6a2a; border-left:none;
}
.wiz-bubble::after{
  content:''; position:absolute; left:-7px; top:26px; border:7px solid transparent; border-right-color:#e8d9b4; border-left:none;
}
.wiz-name{font-family:'Noto Serif TC',serif; font-weight:900; font-size:13px; color:#6b3f8f; margin-bottom:3px; letter-spacing:1px;}
.wiz-text{font-size:14px; line-height:1.65; font-weight:500;}
@media(max-width:560px){
  .wiz-avatar{width:48px; height:48px; font-size:26px; border-width:2px;}
  .wiz-bubble{padding:8px 11px;}
  .wiz-bubble::before{top:14px;} .wiz-bubble::after{top:16px;}
  .wiz-text{font-size:13px;}
}

/* ---------- 關卡主題特效 ---------- */
.stage{border-color:rgba(var(--trgb),0.6); box-shadow:0 0 0 1px rgba(0,0,0,0.7), 0 0 28px rgba(var(--trgb),0.2), inset 0 0 70px rgba(var(--trgb),0.10), 0 10px 30px rgba(0,0,0,0.45); overflow:hidden;}
.stage > *:not(.fx){position:relative; z-index:1;}
.fx{position:absolute; inset:0; pointer-events:none; overflow:hidden; border-radius:inherit; z-index:0;}
.fx-glow{position:absolute; inset:-20%; background:radial-gradient(ellipse at 50% 105%, rgba(var(--trgb),0.38), transparent 60%); animation:breathe 3.4s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:0.3;}50%{opacity:0.85;}}
.pt{position:absolute; border-radius:50%; background:rgba(var(--trgb),0.55); box-shadow:0 0 8px rgba(var(--trgb),0.6);}
.pt.rise{bottom:-20px; animation:rise linear infinite;}
.pt.fall{top:-20px; animation:fall linear infinite;}
.pt.drip{border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;}
.pt.bubble{background:transparent; border:2px solid rgba(var(--trgb),0.65);}
.pt.spark{border-radius:2px; transform:rotate(45deg);}
@keyframes rise{0%{transform:translateY(0) scale(0.6); opacity:0;} 12%{opacity:0.9;} 100%{transform:translateY(-560px) scale(1.15); opacity:0;}}
@keyframes fall{0%{transform:translateY(0); opacity:0;} 12%{opacity:0.8;} 100%{transform:translateY(560px); opacity:0;}}
.fx-flow::before{
  content:''; position:absolute; inset:0;
  background:repeating-linear-gradient(172deg, transparent 0 22px, rgba(var(--trgb),0.10) 22px 30px);
  background-size:100% 240px; animation:flow 2.6s linear infinite;
}
@keyframes flow{from{background-position:0 0;} to{background-position:0 240px;}}
.rune{
  position:absolute; width:360px; height:360px; left:50%; top:50%; margin:-180px 0 0 -180px; border-radius:50%;
  border:2px dashed rgba(var(--trgb),0.35); box-shadow:0 0 40px rgba(var(--trgb),0.2), inset 0 0 40px rgba(var(--trgb),0.15);
  animation:spin 26s linear infinite;
}
.rune::after{content:''; position:absolute; inset:40px; border-radius:50%; border:1px solid rgba(var(--trgb),0.3); animation:spin 14s linear infinite reverse;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- 大廳 ---------- */
.menu-hero{text-align:center; padding:6px 0 18px;}
.menu-hero .crest{font-size:50px; filter:drop-shadow(0 0 12px rgba(217,178,95,0.5));}
.menu-hero h2{font-size:24px; font-weight:900; color:var(--gold-hi); margin:6px 0; text-shadow:0 2px 0 #000;}
.menu-hero p{color:var(--muted); font-size:14px; line-height:1.75; max-width:500px; margin:0 auto;}
.diff-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:18px;}
@media(max-width:560px){.diff-grid{grid-template-columns:1fr;}}
.diff-card{
  border-radius:12px; padding:18px 16px; text-align:left; border:2px solid; color:var(--text); background:rgba(0,0,0,0.35);
  transition:transform .15s, box-shadow .15s; display:flex; flex-direction:column; gap:8px;
}
.diff-card:hover{transform:translateY(-2px);}
.diff-card.basic{border-color:rgba(76,195,138,0.55);}
.diff-card.basic:hover{box-shadow:0 0 18px rgba(76,195,138,0.35);}
.diff-card.adv{border-color:rgba(224,87,79,0.6);}
.diff-card.adv:hover{box-shadow:0 0 18px rgba(224,87,79,0.35);}
.diff-card h3{font-size:18px;}
.diff-card p{font-size:12.5px; color:var(--muted); line-height:1.65; margin:0;}
.diff-tag{display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; width:fit-content;}
.basic .diff-tag{background:rgba(76,195,138,0.2); color:var(--green);}
.adv .diff-tag{background:rgba(224,87,79,0.2); color:var(--red);}
.diff-go{margin-top:4px; font-family:'Noto Serif TC',serif; font-weight:900; font-size:14px; color:var(--gold-hi);}
/* 圖卡按鈕：有圖片時只顯示圖片，沒有圖片時顯示文字卡 */
.diff-img{display:none;}
.diff-card.has-img{padding:0; gap:0; overflow:hidden; background:#120d0e; position:relative;}
.diff-card.has-img .diff-img{display:block; width:100%; height:auto;}
.diff-card.has-img .diff-text{display:none;}
.diff-card.has-img::after{
  content:''; position:absolute; top:0; left:-60%; width:40%; height:100%; pointer-events:none;
  background:linear-gradient(90deg, transparent, rgba(255,240,200,0.35), transparent); transform:skewX(-20deg); opacity:0;
}
.diff-card.has-img:hover::after{animation:cardShine .8s ease forwards;}
@keyframes cardShine{0%{left:-60%; opacity:1;} 100%{left:130%; opacity:1;}}
.diff-text{display:flex; flex-direction:column; gap:8px;}
.rules{margin-top:18px; background:rgba(0,0,0,0.3); border:1px dashed var(--line); border-radius:10px; padding:12px 14px; font-size:12.5px; color:var(--muted); line-height:1.8;}
.rules b{color:var(--gold-hi);}
.rules summary{cursor:pointer; color:var(--gold); font-weight:700;}

/* ---------- 魔物料理展示（真實食物照片 + 分子魔物圖） ---------- */
.showcase{
  display:flex; align-items:stretch; gap:10px; background:rgba(0,0,0,0.35); border:1px solid var(--line);
  border-radius:12px; padding:10px; margin-bottom:14px;
}
.show-food{display:flex; flex-direction:column; align-items:center; gap:6px; flex:0 0 120px;}
.food-pic{width:110px; height:84px; border-radius:8px; border:2px solid var(--gold); font-size:44px; background:#2b2022;}
.show-cap{font-size:12.5px; font-weight:700; text-align:center; color:var(--gold-hi);}
.show-vs{display:flex; align-items:center; font-size:22px; color:var(--gold); text-shadow:0 0 10px rgba(217,178,95,0.6);}
.show-mons{flex:1; display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
.mon{display:flex; flex-direction:column; align-items:center; gap:4px; width:84px;}
.mon-pic{width:62px; height:62px; border-radius:50%; border:2px solid rgba(var(--trgb),0.7); font-size:32px; background:radial-gradient(circle,#3b2c3a,#1a1218);}
.mon-cap{font-size:11.5px; font-weight:700; text-align:center; line-height:1.3;}
.mon-cap small{display:block; color:var(--muted); font-weight:500;}
.run-progress{font-size:11.5px; color:var(--muted); margin-top:2px; text-align:center;}
@media(max-width:480px){
  .show-food{flex-basis:96px;} .food-pic{width:92px; height:70px;}
  .mon{width:70px;} .mon-pic{width:50px; height:50px; font-size:26px;}
}

/* ---------- 題目 ---------- */
.q-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px; gap:10px;}
.q-stage{font-size:20px; font-weight:900; display:flex; align-items:center; gap:8px; color:rgb(var(--trgb)); text-shadow:0 0 12px rgba(var(--trgb),0.5), 0 2px 0 #000;}
.q-stage small{font-size:12px; color:var(--muted); font-family:'Noto Sans TC'; font-weight:500; text-shadow:none;}
.q-progress{font-size:12px; color:var(--muted); font-weight:700; white-space:nowrap; font-family:'Cinzel',serif;}
.q-note{font-size:12.5px; color:var(--gold-hi); background:rgba(217,178,95,0.08); border:1px solid rgba(217,178,95,0.25); border-radius:8px; padding:8px 10px; margin:10px 0 4px; line-height:1.6;}
.timer-label{font-size:10.5px; color:var(--muted); margin-top:14px; letter-spacing:2px;}
.timerbar-outer{height:6px; background:rgba(0,0,0,0.5); border:1px solid rgba(217,178,95,0.2); border-radius:3px; margin:4px 0 16px; overflow:hidden;}
.timerbar{height:100%; background:linear-gradient(90deg,#ff9d5c,var(--gold-hi)); width:100%; transition:width .1s linear; box-shadow:0 0 8px rgba(255,157,92,0.6);}
.q-prompt{font-size:16px; font-weight:700; margin-bottom:14px; line-height:1.6;}
.opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(max-width:480px){.opt-grid{grid-template-columns:1fr;}}
.opt-btn{
  background:linear-gradient(180deg,#3a2e30,#272022); border:2px solid rgba(217,178,95,0.25); color:var(--text);
  border-radius:10px; padding:13px 14px; font-size:14.5px; font-weight:700; text-align:left; transition:all .15s;
}
.opt-btn:hover:not(:disabled){border-color:rgba(var(--trgb),0.9); box-shadow:0 0 12px rgba(var(--trgb),0.35);}
.opt-btn:disabled{cursor:default;}
.opt-btn.correct-flash{background:rgba(76,195,138,0.25); border-color:var(--green); box-shadow:0 0 14px rgba(76,195,138,0.5);}
.opt-btn.wrong-flash{background:rgba(224,87,79,0.22); border-color:var(--red);}
.hint-glow{border-color:var(--gold-hi) !important; animation:hintPulse 1s infinite;}
@keyframes hintPulse{0%,100%{box-shadow:0 0 0 3px rgba(243,220,156,0.35);}50%{box-shadow:0 0 0 7px rgba(243,220,156,0.12);}}
.nutrient-box{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px;}
.chk-pill{
  display:flex; align-items:center; gap:8px; background:linear-gradient(180deg,#3a2e30,#272022); border:2px solid rgba(217,178,95,0.25);
  padding:10px 15px; border-radius:999px; font-weight:700; font-size:14px; user-select:none; cursor:pointer;
}
.chk-pill.checked{border-color:var(--green); background:rgba(76,195,138,0.18);}
.chk-pill input{width:16px; height:16px; accent-color:var(--green);}
.settle-amt{font-size:11.5px; color:var(--muted); font-weight:400;}
.match-grid{display:flex; flex-direction:column; gap:10px; margin-bottom:16px;}
.match-row{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; background:rgba(0,0,0,0.3); border:1px solid rgba(217,178,95,0.2); border-radius:10px; padding:10px 12px;}
.match-gland{font-size:14px; font-weight:700; min-width:90px;}
.match-opts{display:flex; gap:6px; flex-wrap:wrap;}
.match-opt{background:#2b2224; border:2px solid rgba(217,178,95,0.25); color:var(--text); border-radius:8px; padding:8px 12px; font-size:13px; font-weight:700;}
.match-opt.selected{border-color:var(--green); background:rgba(76,195,138,0.22);}
.match-opt:disabled{opacity:0.7;}

/* 施法按鈕 */
.cast-btn{
  background:linear-gradient(180deg,#f0d283,#c0912f 55%,#9c7020); color:#2a1805; border:1px solid var(--gold-hi);
  padding:12px 22px; border-radius:10px; font-family:'Noto Serif TC',serif; font-weight:900; font-size:15px; letter-spacing:1px;
  box-shadow:0 3px 0 #5a3f10, 0 0 16px rgba(217,178,95,0.35); text-shadow:0 1px 0 rgba(255,255,255,0.35);
}
.cast-btn:hover:not(:disabled){filter:brightness(1.08);}
.cast-btn:active:not(:disabled){transform:translateY(2px); box-shadow:0 1px 0 #5a3f10;}
.cast-btn:disabled{opacity:0.4; box-shadow:none; cursor:not-allowed;}
.cast-btn.danger{background:linear-gradient(180deg,#f08a6c,#c0432f 55%,#8e2a1d); color:#fff4ea; border-color:#ffc2a8; box-shadow:0 3px 0 #4f150c, 0 0 16px rgba(224,87,79,0.4); text-shadow:0 1px 0 rgba(0,0,0,0.4);}

function shuffled(arr){ return [...arr].sort(()=>Math.random()-0.5); }

const NUTRIENT_KEY_MAP = {'醣類':'carbs','蛋白質':'protein','脂質':'fat'};
function foodHasNutrient(food, n){ return food[NUTRIENT_KEY_MAP[n]] > 0; }
function foodNutrients(food){ return ['醣類','蛋白質','脂質'].filter(n=>foodHasNutrient(food,n)); }
function chemCorrectAnswer(organ, food){
  if(!organ.nutrients || organ.nutrients.length===0) return '否';
  return organ.nutrients.some(n=>foodHasNutrient(food,n)) ? '是' : '否';
}
const DISTRACTOR_AMOUNTS = {'水分':'80 g','維生素C':'15 mg','維生素E':'10 mg','維生素':'12 mg','礦物質':'1.2 g','纖維質':'3 g'};
function buildSettlementItems(f){
  const items = foodNutrients(f).map(n=>({name:n, amount:f[NUTRIENT_KEY_MAP[n]]+' g', isEnergy:true}));
  f.distractors.forEach(d=>items.push({name:d, amount:DISTRACTOR_AMOUNTS[d]||'少量', isEnergy:false}));
  return shuffled(items);
}

function norm(s){
  let t = String(s == null ? '' : s);
  try{ t = t.normalize('NFKC'); }catch(e){}
  return t.replace(/\s+/g, '');
}
function makePlayer(d){
  const school = norm(d.school).slice(0,30), cls = norm(d.cls).slice(0,10);
  const seatN = parseInt(norm(d.seat), 10);
  const surname = norm(d.surname).slice(0,5), given = norm(d.given).slice(0,10);
  const seat = isNaN(seatN) ? '' : String(seatN);
  return {school, cls, seat, surname, given, id:[school, cls, seat, surname, given].join('|')};
}
function playerParams(p){ return {school:p.school, cls:p.cls, seat:p.seat, surname:p.surname, given:p.given}; }
function loadRemembered(){
  try{ const p = JSON.parse(localStorage.getItem(PLAYER_KEY)); return p && p.id ? p : null; }catch(e){ return null; }
}
function remember(p){ try{ localStorage.setItem(PLAYER_KEY, JSON.stringify(p)); }catch(e){} }
function forget(){ try{ localStorage.removeItem(PLAYER_KEY); }catch(e){} }

function cloudOn(){ return !!(CLOUD.API_URL && CLOUD.API_URL.trim()); }
async function api(action, params){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 20000);
  try{
    const q = new URLSearchParams(Object.assign({action}, params || {}));
    const base = CLOUD.API_URL.trim();
    const res = await fetch(base + (base.includes('?') ? '&' : '?') + q.toString(), {signal:ctrl.signal});
    const data = await res.json();
    if(!data || !data.ok) throw new Error((data && data.error) || 'error');
    return data;
  } finally { clearTimeout(timer); }
}

/* 上傳佇列：網路斷掉時先存在這台電腦，下次連上再補傳 */
function loadPending(){ try{ return JSON.parse(localStorage.getItem(PENDING_KEY)) || []; }catch(e){ return []; } }
function savePending(list){ try{ localStorage.setItem(PENDING_KEY, JSON.stringify(list)); }catch(e){} }
async function flushPending(){
  if(!cloudOn()) return false;
  const queue = loadPending();
  for(const p of queue){
    try{
      const r = await api('submit', {data: JSON.stringify(p)});
      savePending(loadPending().filter(x=>x.runId !== p.runId));
      if(state.player && p.id === state.player.id && r.codex) saveCodex(r.codex);
    }catch(e){ return false; }
  }
  return true;
}

function validateLogin(){

  if(!p.school) return {err:'請輸入學校名稱', field:'inSchool'};

  if(!p.surname) return {err:'請輸入姓氏', field:'inSurname'};

  return {player:p};

async function doLogin(){
  if(state.loginBusy) return;
  const p = state.loginConfirm;
  state.player = p;
  state.loginBusy = true; state.loginError = '';
  render();

      isNew = r.isNew;

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* 排行榜 */
async function openLeader(){
  state.leaderOpen = true;
  state.leaderStatus = cloudOn() ? 'loading' : 'offline';
  render();
  if(!cloudOn()) return;
  try{
    await flushPending();
    const r = await api('leaderboard', state.player ? {pid:state.player.id} : {});
    state.leaderData = r;
    state.leaderStatus = 'ok';
    state.online = true;
  }catch(e){
    state.leaderStatus = 'error';
  }
  if(state.leaderOpen) render();
}
function closeLeader(){ state.leaderOpen = false; render(); }
function setLeaderTab(t){ state.leaderTab = t; render(); }

function setWizard(text, mood){ state.wizard = {text, mood:mood||'calm'}; }
function refreshWizardDom(){
  const t = document.getElementById('wizText');
  const bar = document.getElementById('wizBar');
  if(t) t.textContent = state.wizard.text;
  if(bar) bar.className = 'wizard-bar mood-' + state.wizard.mood;
}
function refreshHud(){
  const s = document.getElementById('scoreVal');
  if(s) s.textContent = state.score;
}

/* =========================================================
   流程控制
   ========================================================= */
function buildQList(organ){
  const digestedHere = chemCorrectAnswer(organ, state.food) === '是';
  const qs = ['chem'];
  if(organ.isSmallIntestine){
    if(digestedHere){
      qs.push('pH','si_match');
      foodNutrients(state.food).forEach(n=>qs.push('si_enzyme:'+n));
    }
    return qs;
  }
  if(organ.askGlandPH && digestedHere){
    qs.push('pH','gland');
    if(organ.askNutrient && state.difficulty==='advanced') qs.push('nutrient');
  }
  return qs;
}

function startRun(difficulty){
  state.difficulty = difficulty;
  state.runFoods = shuffled(FOODS[difficulty]).slice(0, DISHES_PER_RUN);
  state.runIndex = 0;
  state.clearedFoods = [];
  state.stats = {correct:0, total:0, speed:0};
  state.runEarned = 0;
  state.ending = null;
  beginFood();
}

function beginFood(){
  state.food = state.runFoods[state.runIndex];
  state.organIndex = 0; state.qIndex = 0;
  state.qList = buildQList(ORGANS[0]);
  state.hintUses = 0; state.hintActive = false; state.answered = false;
  state.glandShuffled = shuffled(GLAND_OPTIONS);
  state.screen = 'organ';
  setWizard(ORGANS[0].intro, 'calm');
  render(); startTimer();
}

function nextQuestion(){
  state.qIndex++;
  state.answered = false; state.hintActive = false;
  if(state.qIndex >= state.qList.length){
    state.organIndex++;
    if(state.organIndex >= ORGANS.length){
      state.screen = 'settlement';
      state.settleStep = 'select';
      state.settleItems = buildSettlementItems(state.food);
      state.settleCounted = {select:false, calc:false};
      state.kcalDone = false;
      setWizard('魔物已被擊倒，化為一地素材。最後一步：把能量素材煉化成熱魔力吧！', 'calm');
      render();
      return;
    }
    state.qIndex = 0;
    state.qList = buildQList(currentOrgan());
    state.glandShuffled = shuffled(GLAND_OPTIONS);
    setWizard(currentOrgan().intro, 'calm');
  }
  render(); startTimer();
}

function record(isCorrect){
  state.stats.total++;
  if(isCorrect) state.stats.correct++;
}
function earn(points){
  state.score += points;
  state.runEarned += points;
  refreshHud();
}
function award(qType){
  let e = pointsFor(qType);
  let bonus = false;
  if(state.speedEligible){ e += SPEED_BONUS; bonus = true; state.stats.speed++; }
  earn(e);
  showCorrectFeedback(e, bonus);
  setWizard(pickOne(PRAISE), 'happy');
  refreshWizardDom();
  setTimeout(()=>{ if(state.screen==='organ') nextQuestion(); }, 1100);
}

function loseHeart(){
  state.hp = Math.max(0, state.hp-1);
  if(state.hp <= 0) finishRun('gameover');
}

function afterFood(){
  state.clearedFoods.push({food:state.food, kcal:kcalOf(state.food)});
  state.runIndex++;
  if(state.runIndex >= DISHES_PER_RUN){
    finishRun('clear');
    render();
  } else {
    state.screen = 'intermission';
    setWizard(`漂亮！已淨化 ${state.runIndex} 道魔物料理。休息一下，下一道料理已經在石窟口蠢蠢欲動了……`, 'happy');
    render();
  }
}

/* =========================================================
   計時（速攻加成）
   ========================================================= */
function startTimer(){
  stopTimer();
  state.speedEligible = true; state.timerPct = 100;
  const start = Date.now();
  timerHandle = setInterval(()=>{
    const pct = Math.max(0, 100 - (Date.now()-start)/SPEED_WINDOW_MS*100);
    state.timerPct = pct;
    if(pct <= 0) state.speedEligible = false;
    const bar = document.getElementById('timerbar');
    if(bar) bar.style.width = pct + '%';
    else stopTimer();
  }, 100);
}
function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle = null; } }

/* =========================================================
   作答
   ========================================================= */
function answerSingle(qType, chosen, correct){
  if(state.answered) return;
  state.answered = true;
  const isCorrect = chosen === correct;
  let correctText = correct;
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.disabled = true;
    if(b.dataset.val === correct){ b.classList.add('correct-flash'); correctText = b.textContent.trim(); }
    else if(b.dataset.val === chosen && !isCorrect) b.classList.add('wrong-flash');
  });
  stopTimer();
  record(isCorrect);
  if(isCorrect) award(qType);
  else { loseHeart(); openWrongModal(correctText, 'nextQuestion', explainFor(qType)); }
}

function sameSet(a, b){ return [...a].sort().join(',') === [...b].sort().join(','); }

function answerNutrient(selected){
  if(state.answered) return;
  state.answered = true;
  const o = currentOrgan();
  const correctSet = o.nutrients.filter(n=>foodHasNutrient(state.food, n));
  const ok = sameSet(selected, correctSet);
  stopTimer(); record(ok);
  if(ok) award('nutrient');
  else { loseHeart(); openWrongModal(correctSet.map(monLabel).join('、'), 'nextQuestion'); }
}

function answerMatch(){
  if(state.answered) return;
  state.answered = true;
  const o = currentOrgan();
  const ok = o.glands.every(g=>matchSelections[g.gland] === g.juice);
  stopTimer(); record(ok);
  document.querySelectorAll('.match-opt').forEach(b=>b.disabled = true);
  const btn = document.getElementById('submitMatch'); if(btn) btn.disabled = true;
  if(ok) award('si_match');
  else { loseHeart(); openWrongModal(o.glands.map(g=>`${g.gland} → ${g.juice}`).join('、'), 'nextQuestion'); }
}

function answerEnzyme(nutrient, selected){
  if(state.answered) return;
  state.answered = true;
  const o = currentOrgan();
  const correctSet = o.glands.filter(g=>g.enzymes.includes(nutrient)).map(g=>g.juice);
  const ok = sameSet(selected, correctSet);
  stopTimer(); record(ok);
  if(ok) award('si_enzyme');
  else {
    loseHeart();
    const label = `能分解${monLabel(nutrient)}的是：${correctSet.join('、')}`;
    const explain = nutrient==='脂質'
      ? '補充：膽汁不含酵素，但能把脂肪乳化成小油滴（物理消化），讓胰液更容易分解它。'
      : '補充：膽汁不含消化酵素，所以不能對任何養分進行化學消化。';
    openWrongModal(label, 'nextQuestion', explain);
  }
}

function explainFor(qType){
  if(qType==='chem'){
    const o = currentOrgan();
    if(!o.hasChemical) return `${o.name}${o.note ? '：' + o.note : '沒有分泌消化液。'}`;
    return `「${state.food.name}」含有：${foodNutrients(state.food).map(monLabel).join('、')}。${o.name}的消化液能分解：${o.nutrients.map(monLabel).join('、')}。`;
  }
  return '';
}

function showCorrectFeedback(earned, bonus){
  const zone = document.getElementById('feedbackZone');
  if(zone) zone.innerHTML = `<div class="feedback-banner ok">✨ 命中！+${earned} 熱魔力${bonus?'（含 ⚡速攻加成）':''}</div>`;
}

/* 答錯視窗 */
function openWrongModal(correctLabel, action, explain){
  document.querySelectorAll('.heart').forEach(h=>{ h.classList.add('shake'); setTimeout(()=>h.classList.remove('shake'), 400); });
  state.wrongModal = {correctLabel, action, explain:explain||''};
  render();
}
function closeWrongModal(){
  const action = state.wrongModal ? state.wrongModal.action : null;
  state.wrongModal = null;
  if(state.screen === 'ending'){ render(); return; }
  if(action === 'nextQuestion'){
    setWizard('別氣餒，失敗也是修行的一部分。繼續前進吧！', 'calm');
    nextQuestion();
  } else {
    setWizard('冷靜下來，再仔細算一次。老夫相信你。', 'calm');
    render();
  }
}

/* =========================================================
   能量結算
   ========================================================= */
function answerSettleSelect(){
  const box = document.getElementById('settleSelectBox');
  const selected = [...box.querySelectorAll('input:checked')].map(i=>i.value);
  const correctSet = state.settleItems.filter(it=>it.isEnergy).map(it=>it.name);
  const ok = sameSet(selected, correctSet);
  if(!state.settleCounted.select){ record(ok); state.settleCounted.select = true; }
  if(ok){
    state.settleStep = 'calc';
    state.hintActive = false;
    setWizard('很好，能量素材已鎖定！現在依照煉金公式，算出總熱量吧。', 'happy');
    render();
  } else {
    loseHeart();
    openWrongModal(correctSet.join('、'), 'retrySettle', '只有醣類、蛋白質、脂質能產生熱量；水分、維生素、礦物質、纖維質都不會。');
  }
}

function submitKcal(){
  if(state.kcalDone) return;
  const input = document.getElementById('kcalInput');
  const val = parseInt(input.value, 10);
  if(isNaN(val)) return;
  const correct = kcalOf(state.food);
  const ok = val === correct;
  if(!state.settleCounted.calc){ record(ok); state.settleCounted.calc = true; }
  if(ok){
    state.kcalDone = true;
    earn(correct);
    const zone = document.getElementById('settleFeedback');
    if(zone) zone.innerHTML = `<div class="feedback-banner ok">💎 能量結晶煉成！這道料理提供 <b>${correct} 大卡</b>，轉換為 +${correct} 熱魔力！</div>`;
    setWizard('完美的煉金術！熱魔力湧入你的體內了。', 'happy');
    refreshWizardDom();
    setTimeout(afterFood, 1400);
  } else {
    loseHeart();
    openWrongModal(correct + ' 大卡', 'retrySettle', `算式：${formulaText(state.food)} = ${correct}`);
  }
}
function formulaText(f){
  const parts = [];
  if(f.carbs) parts.push(`${f.carbs}×4`);
  if(f.protein) parts.push(`${f.protein}×4`);
  if(f.fat) parts.push(`${f.fat}×9`);
  return parts.join(' + ');
}

/* =========================================================
   冒險結束與便便卡掉落
   ========================================================= */
function rollRarity(table){
  let r = Math.random()*100, acc = 0;
  for(const [rar, p] of table){ acc += p; if(r < acc) return rar; }
  return table[table.length-1][0];
}
function randomCardOf(rarity){ return pickOne(CARDS.filter(c=>c.rarity===rarity)); }

function finishRun(type){
  stopTimer();
  const acc = state.stats.total ? state.stats.correct / state.stats.total : 0;
  let grade, draws = [];
  if(type === 'gameover'){
    grade = 'X';
    draws = [CARDS.find(c=>c.id==='curse_diarrhea')];
  } else if(acc >= 0.9){
    grade = 'S';
    for(let i=0;i<2;i++) draws.push(randomCardOf(rollRarity([['SSR',30],['SR',50],['R',20]])));
  } else if(acc >= 0.7){
    grade = 'A';
    draws.push(randomCardOf(rollRarity([['SR',50],['R',50]])));
  } else if(acc >= 0.5){
    grade = 'B';
    draws.push(randomCardOf('R'));
  } else {
    grade = 'C';
    draws.push(CARDS.find(c=>c.id==='n_gas'));
  }
  const codex = loadCodex();
  const cards = draws.map(card=>{
    const isNew = !codex[card.id];
    codex[card.id] = (codex[card.id]||0) + 1;
    return {card, isNew};
  });
  saveCodex(codex);
  if(state.player){
    submitRun({
      ...playerParams(state.player), id:state.player.id,
      runId: Date.now().toString(36) + Math.random().toString(36).slice(2,8),
      difficulty:state.difficulty, result:type, acc, earned:state.runEarned, grade,
      cards: draws.map(c=>c.id)
    });
  }
  const words = {
    S:'了不起！你的消化魔法已臻化境，老夫特別賞你兩次抽卡機會！',
    A:'相當出色的冒險，地下城的魔物都對你心服口服。',
    B:'勉強過關……再多鑽研消化之道，便便的品質會更好喔。',
    C:'唉，魔物大多從你指縫溜走了……結果只拉出了一團氣。',
    X:'生命耗盡……整座地下城被泥石流淹沒了。年輕人，重新來過吧！'
  };
  setWizard(words[grade], grade==='X'||grade==='C' ? 'sad' : 'happy');
  state.ending = {type, grade, acc, cards};
  state.hintActive = false;
  state.screen = 'ending';
}

   商店與提示
   ========================================================= */
function toggleShop(open){ state.shopOpen = open; render(); }
function toggleCodex(open){ state.codexOpen = open; render(); }
function canUseHint(){
  if(state.hintUses >= 3 || state.hintActive) return false;
  if(state.screen === 'organ') return !state.answered;
  if(state.screen === 'settlement') return !state.kcalDone;
  return false;
}
function buyHeart(type){
  const item = SHOP[type];
  if(state.score < item.price || state.hp >= MAX_HP) return;
  state.score -= item.price;
  state.hp = Math.min(MAX_HP, state.hp + item.heal);
  render();
}
function buyHint(){
  const price = SHOP.hintPrices[state.hintUses];
  if(!canUseHint() || state.score < price) return;
  state.score -= price;
  state.hintUses++;
  state.hintActive = true;
  state.shopOpen = false;
  state.hintModalOpen = true;
  render();
}
function closeHintModal(){ state.hintModalOpen = false; render(); }

function resetCodex(){
  if(confirm('確定要清空便便圖鑑嗎？此動作無法復原。')){
    saveCodex({});
    render();
  }
}

function themeKey(){
  if(state.screen === 'organ') return currentOrgan().key;
  if(state.screen === 'settlement' || state.screen === 'intermission') return 'settle';
  if(state.screen === 'ending') return state.ending && state.ending.grade === 'X' ? 'curse' : 'hall';
  return 'hall';
}

/* 每個關卡用自己的底圖；圖片確定載入成功才換上，並把暗色遮罩調淡讓圖片看得見 */
function bgKey(){
  if(state.screen === 'organ') return currentOrgan().key;
  if(state.screen === 'settlement' || state.screen === 'intermission') return 'settle';
  return 'lobby';
}
let currentBg = null;
function applyBg(src){
  const st = document.body.style;
  if(src){
    st.setProperty('--bgimg', `url("${src}")`);
    st.setProperty('--dim-top', '0.45'); st.setProperty('--dim-bottom', '0.7');
  } else {
    st.setProperty('--bgimg', 'none');
    st.removeProperty('--dim-top'); st.removeProperty('--dim-bottom');
  }
}
function setBackground(src){
  if(src === currentBg) return;
  currentBg = src;
  if(!src || BAD_IMG.has(src)){ applyBg(null); return; }
  const im = new Image();
  im.onload = ()=>{ if(currentBg === src) applyBg(src); };
  im.onerror = ()=>{ BAD_IMG.add(src); if(currentBg === src) applyBg(null); };
  im.src = src;
}

function render(){
  const tk = themeKey();
  document.documentElement.style.setProperty('--trgb', THEMES[tk].rgb);
  setBackground(ASSETS.background[bgKey()]);

  const showMap = state.screen !== 'ending' && state.screen !== 'login';
  const app = document.getElementById('app');
  app.innerHTML =
    topBarHtml() +
    `<div class="game-layout">
      ${showMap ? `<div class="map-col">${mapHtml()}</div>` : ''}
      <div class="content-col">${wizardHtml()}${screenHtml(tk)}</div>
    </div>` +
    (state.shopOpen ? shopHtml() : '') +
    (state.codexOpen ? codexHtml() : '') +
    (state.leaderOpen ? leaderHtml() : '') +
    (state.wrongModal ? wrongModalHtml() : '') +
    (state.hintModalOpen ? hintModalHtml() : '');
  bindEvents();
}

function fxHtml(tk){
  const t = THEMES[tk];
  let parts = '';
  const dir = t.fx === 'fall' || t.kind === 'drip' ? 'fall' : 'rise';
  for(let i=0;i<t.n;i++){
    const left = (i*37 + 11) % 100;
    const size = t.kind==='bubble' ? 8 + (i*5)%14 : t.kind==='dust' ? 3 + i%3 : t.kind==='drip' ? 5 + i%4 : 4 + i%4;
    const dur = (t.kind==='bubble' ? 5 : 7) + (i*1.3)%5;
    const delay = -((i*1.7) % dur);
    const h = t.kind==='drip' ? size*1.6 : size;
    parts += `<span class="pt ${dir} ${t.kind}" style="left:${left}%; width:${size}px; height:${h}px; animation-duration:${dur.toFixed(1)}s; animation-delay:${delay.toFixed(1)}s;"></span>`;
  }
  const flowCls = t.fx === 'flow' ? ' fx-flow' : '';
  const rune = t.fx === 'rune' ? '<div class="rune"></div>' : '';
  return `<div class="fx${flowCls}"><div class="fx-glow"></div>${rune}${parts}</div>`;
}

function topBarHtml(){

  for(let i=0;i<MAX_HP;i++) hearts += `<span class="heart ${i<state.hp?'':'empty'}">❤️</span>`;
  const shopBtn = (state.screen==='ending' && state.ending && state.ending.grade==='X') ? '' : `<button class="hud-btn" id="openShop">⚗️ 大賢者的店</button>`;
  return `
  <div class="topbar">

        <span class="en">HUMAN DUNGEON</span>

        <span class="sub">消化魔法使的考驗 · 蔡譯禎老師設計</span>
      </div>
    </div>
    ${state.screen === 'login' ? '' : `
    <div class="hud">
      <div class="hearts">${hearts}</div>
      <div class="mana-chip">🔥 熱魔力 <b id="scoreVal">${state.score}</b></div>
      ${shopBtn}
      <button class="hud-btn" id="openCodex">📖 便便圖鑑</button>

/* 排行榜與換人只在不是作答中的畫面開放，避免打斷題目 */

function leaderHtml(){

      <tr class="${r.me?'me ':''}${r.rank<=3?'top'+r.rank:''}">

/* ---------- 地圖 ---------- */
const ORGAN_MARKERS = [
  {key:'mouth', x:36.6, y:17.6}, {key:'pharynx', x:49.3, y:20.2}, {key:'esophagus', x:52.7, y:37.4},
  {key:'stomach', x:66.9, y:55.0}, {key:'liver', x:41.0, y:53.1}, {key:'pancreas', x:62.0, y:62.2},
  {key:'si', x:43.0, y:69.0}, {key:'large', x:38.1, y:79.1}, {key:'anus', x:51.8, y:93.1}
];
function organStatus(idx){
  if(state.screen === 'organ'){
    if(idx < state.organIndex) return 'done';
    if(idx === state.organIndex) return 'current';
    return 'upcoming';
  }
  if(state.screen === 'settlement' || state.screen === 'intermission') return 'done';
  return 'upcoming';
}
function glandStatus(){
  const si = ORGANS.findIndex(o=>o.isSmallIntestine);
  if(state.screen === 'organ'){
    if(state.organIndex === si) return 'active-gland';
    if(state.organIndex > si) return 'done';
    return 'upcoming';
  }
  if(state.screen === 'settlement' || state.screen === 'intermission') return 'done';
  return 'upcoming';
}
function mapHtml(){
  const g = glandStatus();
  const cls = {mouth:organStatus(0), pharynx:organStatus(1), esophagus:organStatus(2), stomach:organStatus(3),
    liver:g, pancreas:g, si:organStatus(4), large:organStatus(5), anus:organStatus(6)};
  const markers = ORGAN_MARKERS.map(m=>`<div class="organ-marker status-${cls[m.key]}" style="left:${m.x}%; top:${m.y}%;"></div>`).join('');
  const d = ASSETS.diagram;
  const diagram = BAD_IMG.has(d) ? '' :
    `<div class="diagram-wrap"><img src="${d}" class="diagram-img" alt="消化系統地圖" onerror="markBad(this,'${d}'); this.closest('.diagram-wrap').remove();">${markers}</div>`;
  const dotColor = {done:'var(--green)', current:'var(--red)', upcoming:'#6b5e4f'};
  const path = ORGANS.map((o,i)=>{
    const s = organStatus(i);
    return `<li class="p-${s}"><i class="dot" style="background:${dotColor[s]}"></i>${o.icon} ${o.stage}<small>${o.name}</small></li>`;
  }).join('');
  return `
  <div class="panel map-panel">
    <div class="map-title">地下城地圖<small>DUNGEON MAP</small></div>
    ${diagram}
    <ul class="path-list">${path}</ul>
    <div class="map-legend">
      <span class="legend-item"><i class="legend-dot" style="background:var(--red)"></i>所在層</span>
      <span class="legend-item"><i class="legend-dot" style="background:var(--gold)"></i>援軍腺體</span>
      <span class="legend-item"><i class="legend-dot" style="background:var(--green)"></i>已攻略</span>
    </div>
  </div>`;
}

function organHtml(tk){
  const o = currentOrgan();
  const qType = currentQType();
  let body = '';
  if(qType === 'chem'){
    const correct = chemCorrectAnswer(o, state.food);
    const prompt = o.nutrients && o.nutrients.length
      ? `「${state.food.name}」帶著魔物闖入了【${stageLabel(o)}】。這裡分泌的消化液，是否含有酵素，能對它施展化學消化？`
      : `「${state.food.name}」來到了【${stageLabel(o)}】。這裡會對它進行化學消化嗎？`;
    body = optionQuestionHtml('chem', prompt,
      [{val:'是', label:'✨ 施放消化魔法！'}, {val:'否', label:'🛑 按兵不動，放它通過'}], correct);
  } else if(qType === 'pH'){
    body = optionQuestionHtml('pH', `以魔力感知【${stageLabel(o)}】的環境，這裡的酸鹼值是？`,
      [{val:'酸性', label:'🔥 判定：酸性'}, {val:'中性', label:'⚖️ 判定：中性'}, {val:'鹼性', label:'💠 判定：鹼性'}], o.pH);
  } else if(qType === 'gland'){
    const opts = state.glandShuffled.map(g=>({val:`${g.gland}→${g.juice}`, label:`🔮 召喚 ${g.gland} → ${g.juice}`}));
    body = optionQuestionHtml('gland', `召喚守護此地的消化腺，並選出它分泌的消化液：`, opts, `${o.gland}→${o.juice}`);
  } else if(qType === 'si_match'){
    body = siMatchHtml(o);
  } else if(qType.startsWith('si_enzyme:')){
    body = siEnzymeHtml(o, qType.split(':')[1]);
  } else if(qType === 'nutrient'){
    body = nutrientQuestionHtml(o);
  }
  return `
  <div class="panel stage">
    ${fxHtml(tk)}
    ${showcaseHtml()}
    <div class="q-head">
      <div class="q-stage">${o.icon} ${o.stage}<small>（${o.name}）</small></div>
      <div class="q-progress">FLOOR ${state.organIndex+1} / ${ORGANS.length}</div>
    </div>

    <div class="timerbar-outer"><div class="timerbar" id="timerbar" style="width:${state.timerPct}%"></div></div>
    ${body}
    <div id="feedbackZone"></div>
  </div>`;
}

function optionQuestionHtml(qType, prompt, options, correct){
  const btns = options.map(opt=>{
    const hint = state.hintActive && opt.val === correct ? ' hint-glow' : '';
    return `<button class="opt-btn${hint}" data-val="${opt.val}" data-qtype="${qType}" data-correct="${correct}">${opt.label}</button>`;
  }).join('');
  return `<div class="q-prompt">${prompt}</div><div class="opt-grid">${btns}</div>`;
}

    <h2 class="ending-title">營火休息站</h2>
    <ul class="cleared-list">${done}<li class="next"><span>❓ 第 ${nextNo} 道魔物料理</span><span>？？？</span></li></ul>
    <div class="stat-row">
      <div class="stat"><b>${state.stats.total ? Math.round(state.stats.correct/state.stats.total*100) : 0}%</b><span>目前正確率</span></div>
      <div class="stat"><b>${state.runEarned}</b><span>本次熱魔力</span></div>
    </div>
    <div class="btn-row"><button class="cast-btn" id="nextFood">⚔️ 迎戰第 ${nextNo} 道料理！</button></div>
  </div>`;
}

/* ---------- 結局 ---------- */
function cardHtml(card, opts){
  opts = opts || {};
  const locked = opts.locked;
  const name = locked ? '？？？' : card.name;
  const src = ASSETS.cards[card.id];
  const hasArt = src && !BAD_IMG.has(src);
  /* 有卡牌圖：整張卡完整顯示（卡框、等級、名稱都在圖裡），衛教說明放在下方；沒有圖：用文字版卡片 */
  const full = hasArt
    ? `<img class="pcard-full" src="${src}" alt="${locked ? '尚未獲得' : card.name}" onerror="BAD_IMG.add('${src}'); this.closest('.pcard').classList.remove('has-art'); this.remove();">`
    : '';
  const art = pic(null, card.emoji, 'pcard-art');
  return `
  <div class="pcard r-${card.rarity}${hasArt?' has-art':''}${locked?' locked':''}${opts.reveal?' reveal':''}" style="${opts.delay?`animation-delay:${opts.delay}s;`:''}">
    ${full}
    ${opts.isNew ? '<div class="pcard-new">NEW!</div>' : ''}
    ${opts.count ? `<div class="pcard-count">×${opts.count}</div>` : ''}
    <div class="pcard-rar">${RARITY_LABEL[card.rarity]}</div>
    ${art}
    <div class="pcard-name">${name}</div>
    ${locked ? '<div class="pcard-desc">尚未獲得</div>' : `<div class="pcard-desc">${card.desc}</div><div class="pcard-tip">${card.tip}</div>`}
  </div>`;
}

function endingHtml(tk){
  const e = state.ending;
  const titles = {S:'S 評價・完美攻略！', A:'A 評價・漂亮通關', B:'B 評價・勉強過關', C:'正確率不足 50%', X:'冒險失敗・生命耗盡'};
  const codex = loadCodex();
  const cards = e.cards.map((c,i)=>cardHtml(c.card, {reveal:true, delay:0.3 + i*0.45, isNew:c.isNew, count:codex[c.card.id]})).join('');
  const buttons = e.type === 'gameover'
    ? `<button class="cast-btn danger" id="restartBtn">🔄 重新踏上冒險</button>`
    : `<button class="cast-btn" id="hallBtn">🏰 返回大廳，再次冒險</button>`;
  return `
  <div class="panel stage center">
    ${fxHtml(tk)}
    <div class="grade-badge grade-${e.grade}">${e.grade==='X'?'☠':e.grade}</div>
    <h2 class="ending-title">${titles[e.grade]}</h2>
    <div class="stat-row">
      <div class="stat"><b>${Math.round(e.acc*100)}%</b><span>正確率（${state.stats.correct}/${state.stats.total}）</span></div>
      <div class="stat"><b>${state.runEarned}</b><span>本次熱魔力</span></div>
      <div class="stat"><b>${state.stats.speed}</b><span>速攻次數</span></div>
      <div class="stat"><b>${state.clearedFoods.length}/${DISHES_PER_RUN}</b><span>淨化料理</span></div>
    </div>
    <div class="drop-title">— 掉落的便便卡 —</div>
    <div class="drop-row">${cards}</div>
    <div class="btn-row">
      ${buttons}
      <button class="cast-btn ghost" id="codexBtn2">📖 查看便便圖鑑</button>
      <button class="cast-btn ghost" id="leaderBtn2">🏆 查看排行榜</button>
    </div>
    <div class="upload-status ${state.uploadStatus==='ok'?'ok':state.uploadStatus==='fail'?'fail':''}" id="uploadStatus">${UPLOAD_TEXT[state.uploadStatus] || ''}</div>
  </div>`;
}

/* ---------- 對話視窗 ---------- */
function npcLine(text, mood){
  return `
  <div class="wizard-bar mood-${mood||'calm'}">
    ${pic(ASSETS.wizard, '🧙', 'wiz-avatar')}
    <div class="wiz-bubble"><div class="wiz-name">腸道大賢者</div><div class="wiz-text">${text}</div></div>
  </div>`;
}

function wrongModalHtml(){
  const w = state.wrongModal;
  const isOver = state.screen === 'ending';
  const btnLabel = isOver ? '面對結局……' : (w.action === 'retrySettle' ? '🔁 重新詠唱' : '⚔️ 重整旗鼓，繼續前進');
  return `
  <div class="modal-overlay">
    <div class="modal panel npc-modal">
      ${npcLine('唔……這道咒文失手了。看清楚，正確的答案是這個：', 'sad')}
      <div class="answer-reveal">✅ <b>${w.correctLabel}</b></div>
      ${w.explain ? `<div class="explain">📜 ${w.explain}</div>` : ''}
      <div class="hp-loss">💔 生命 -1（剩下 ${state.hp} 點）</div>
      <div class="btn-row"><button class="cast-btn" id="wrongContinueBtn">${btnLabel}</button></div>
    </div>
  </div>`;
}

function hintModalHtml(){
  const isCalc = state.screen === 'settlement' && state.settleStep === 'calc';
  const text = isCalc
    ? '呵呵……老夫已把算式寫在卷軸上，剩下的加法就靠你自己了。'
    : '呵呵……老夫已為你點亮線索。閃爍著金光的，便是正確答案。';
  return `
  <div class="modal-overlay">
    <div class="modal panel npc-modal">
      ${npcLine(text, 'happy')}
      <div class="btn-row"><button class="cast-btn" id="hintContinueBtn">🙏 感謝大賢者！</button></div>
    </div>
  </div>`;
}

function shopHtml(){
  const hintPrice = state.hintUses < 3 ? SHOP.hintPrices[state.hintUses] : null;
  const hintDisabled = !canUseHint() || state.score < hintPrice;
  const smallDisabled = state.score < SHOP.smallHeart.price || state.hp >= MAX_HP;
  const largeDisabled = state.score < SHOP.largeHeart.price || state.hp >= MAX_HP;
  let hintNote;
  if(state.hintUses >= 3) hintNote = '這道料理的指引次數已用完（每道料理限 3 次）。';
  else if(state.hintActive) hintNote = '指引已經生效中，先把這題解開吧。';
  else if(!(state.screen==='organ' || state.screen==='settlement')) hintNote = '只能在闖關或能量結算時使用。';
  else hintNote = `這道料理第 ${state.hintUses+1} 次指引（價格逐次提高）。會讓正確答案發出金光；計算熱量時則會寫出算式。`;
  return `
  <div class="modal-overlay" id="shopOverlay">
    <div class="modal panel npc-modal">
      <div class="modal-head"><h3>⚗️ 大賢者的店</h3><button class="close-x" id="closeShop">✕</button></div>
      ${npcLine('年輕的魔法使啊，你需要老夫的提示嗎？這只要消耗你一點點魔力（熱魔力）……藥水也有，看你的生命快撐不住了吧？', 'calm')}
      <div class="shop-balance">持有熱魔力：<b>${state.score}</b></div>
      <div class="shop-item">
        <div class="ic">🧪</div>
        <div class="info"><h4>小治癒藥水・${SHOP.smallHeart.price} 熱魔力</h4><p>恢復 1 點生命（生命全滿時無法飲用）</p></div>
        <button class="cast-btn" id="buySmall" ${smallDisabled?'disabled':''}>飲下藥水</button>
      </div>
      <div class="shop-item">
        <div class="ic">⚗️</div>
        <div class="info"><h4>大治癒藥水・${SHOP.largeHeart.price} 熱魔力</h4><p>恢復 2 點生命（生命全滿時無法飲用）</p></div>
        <button class="cast-btn" id="buyLarge" ${largeDisabled?'disabled':''}>飲下藥水</button>
      </div>
      <div class="shop-item">
        <div class="ic">💡</div>
        <div class="info"><h4>賢者的指引・${hintPrice!==null ? hintPrice+' 熱魔力' : '已用完'}</h4><p>${hintNote}</p></div>
        <button class="cast-btn" id="buyHint" ${hintDisabled?'disabled':''}>請求指引</button>
      </div>
      <div class="shop-note">花在商店的熱魔力不會影響便便卡的掉落評價</div>
    </div>
  </div>`;
}

function codexHtml(){
  const codex = loadCodex();
  const owned = CARDS.filter(c=>codex[c.id]).length;
  const groups = RARITY_GROUP.map(g=>{
    const cards = CARDS.filter(c=>c.rarity===g.r).map(c=>cardHtml(c, {locked:!codex[c.id], count:codex[c.id]})).join('');
    return `<div class="codex-group"><h4>${g.title}</h4><div class="codex-grid">${cards}</div></div>`;
  }).join('');
  return `
  <div class="modal-overlay" id="codexOverlay">
    <div class="modal panel wide">
      <div class="modal-head"><h3>📖 便便圖鑑</h3><button class="close-x" id="closeCodex">✕</button></div>
      <div class="codex-summary">已收集 <b>${owned} / ${CARDS.length}</b> 種便便。重複獲得的卡片會顯示數量。</div>
      ${groups}
      ${cloudOn() ? `<div class="codex-summary center">☁️ 圖鑑存在雲端，換電腦登入同樣的資料就會回來。</div>` : `<div class="center"><button class="reset-link" id="resetCodex">清空這台電腦的圖鑑紀錄</button></div>`}
    </div>
  </div>`;
}

/* =========================================================
   事件綁定
   ========================================================= */
function on(id, fn){ const el = document.getElementById(id); if(el) el.onclick = fn; }
function bindPills(boxId){
  const box = document.getElementById(boxId);
  if(!box) return null;
  box.querySelectorAll('.chk-pill').forEach(pill=>{
    const cb = pill.querySelector('input');
    cb.addEventListener('change', ()=>pill.classList.toggle('checked', cb.checked));
  });
  return box;
}
function checkedVals(box){ return [...box.querySelectorAll('input:checked')].map(i=>i.value); }

function bindEvents(){
  on('openShop', ()=>toggleShop(true));
  on('closeShop', ()=>toggleShop(false));
  on('openCodex', ()=>toggleCodex(true));
  on('codexBtn2', ()=>toggleCodex(true));
  on('openLeader', openLeader);
  on('leaderBtn2', openLeader);
  on('closeLeader', closeLeader);
  on('switchPlayer', switchPlayer);
  document.querySelectorAll('.tab[data-tab]').forEach(b=>{ b.onclick = ()=>setLeaderTab(b.dataset.tab); });
  const lo = document.getElementById('leaderOverlay');
  if(lo) lo.addEventListener('click', e=>{ if(e.target===lo) closeLeader(); });

  on('submitLogin', submitLoginForm);
  on('confirmLogin', doLogin);
  on('editLogin', editLogin);
  on('notMe', notMe);
  ['inSchool','inCls','inSeat','inSurname','inGiven'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('input', ()=>el.classList.remove('bad'));
    el.addEventListener('keydown', e=>{ if(e.key==='Enter') submitLoginForm(); });
  });
  if(state.screen === 'login') loadSchools();
  on('closeCodex', ()=>toggleCodex(false));
  on('resetCodex', resetCodex);
  ['shopOverlay','codexOverlay'].forEach(id=>{
    const ov = document.getElementById(id);
    if(ov) ov.addEventListener('click', e=>{ if(e.target===ov){ state.shopOpen=false; state.codexOpen=false; render(); } });
  });

  on('buySmall', ()=>buyHeart('smallHeart'));
  on('buyLarge', ()=>buyHeart('largeHeart'));
  on('buyHint', buyHint);

  on('pickBasic', ()=>startRun('basic'));
  on('pickAdv', ()=>startRun('advanced'));
  on('nextFood', beginFood);
  on('hallBtn', backToHall);
  on('restartBtn', restartGame);
  on('wrongContinueBtn', closeWrongModal);
  on('hintContinueBtn', closeHintModal);

  document.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.onclick = ()=>answerSingle(btn.dataset.qtype, btn.dataset.val, btn.dataset.correct);
  });

  const nb = bindPills('nutrientBox');
  if(nb) on('submitNutrient', ()=>answerNutrient(checkedVals(nb)));

  const eb = bindPills('enzymeBox');
  if(eb) on('submitEnzyme', ()=>answerEnzyme(currentQType().split(':')[1], checkedVals(eb)));

  const sb = bindPills('settleSelectBox');
  if(sb) on('submitSettleSelect', answerSettleSelect);

  const grid = document.getElementById('matchGrid');
  if(grid){
    grid.querySelectorAll('.match-opt').forEach(btn=>{
      btn.onclick = ()=>{
        const row = btn.dataset.row;
        grid.querySelectorAll(`.match-opt[data-row="${row}"]`).forEach(b=>b.classList.remove('selected'));
        btn.classList.add('selected');
        matchSelections[row] = btn.dataset.val;
        const sub = document.getElementById('submitMatch');
        if(sub) sub.disabled = Object.keys(matchSelections).length < currentOrgan().glands.length;
      };
    });
    on('submitMatch', answerMatch);
  }

  on('submitKcal', submitKcal);
  const kin = document.getElementById('kcalInput');
  if(kin) kin.addEventListener('keydown', e=>{ if(e.key==='Enter') submitKcal(); });
}

render();
</script>
</body>
</html>
