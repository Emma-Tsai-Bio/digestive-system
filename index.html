<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消化歷程大冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F0E3;
  --panel:#FFFFFF;
  --panel-alt:#F1E7D3;
  --panel-line: rgba(58,42,30,0.14);
  --coral:#E85A38;
  --coral-dark:#C4431F;
  --mint:#2E9C73;
  --mint-dark:#1F7B59;
  --gold:#C98D1E;
  --gold-dark:#A67212;
  --danger:#D14F45;
  --text:#3A2A1E;
  --text-muted:#8C7A63;
  --radius:18px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
button, .opt-btn, .match-opt, .chk-pill, .diff-card, .shop-btn, .submit-btn, .buy-btn, .close-x{
  touch-action:manipulation;
}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse at 20% -10%, rgba(232,90,56,0.10), transparent 55%),
    radial-gradient(ellipse at 90% 0%, rgba(46,156,115,0.10), transparent 50%),
    var(--bg);
  color:var(--text);
  font-family:'Noto Sans TC', sans-serif;
  padding:20px 14px 60px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Baloo 2','Noto Sans TC',sans-serif; margin:0;}
button{font-family:inherit; cursor:pointer;}
.wrap{max-width:960px; margin:0 auto;}

/* ---------- Two-column game layout ---------- */
.game-layout{display:flex; gap:18px; align-items:flex-start;}
.diagram-col{flex:0 0 30%; max-width:300px; min-width:220px; position:sticky; top:16px;}
.content-col{flex:1; min-width:0;}
@media(max-width:760px){
  .game-layout{flex-direction:column;}
  .diagram-col{flex:none; max-width:100%; width:100%; position:static;}
}

/* ---------- Top bar ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; margin-bottom:16px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:10px;}
.brand-emoji{font-size:30px;}
.brand h1{font-size:22px; font-weight:800; letter-spacing:0.5px;}
.brand span{display:block; font-size:11px; color:var(--text-muted); font-weight:400; margin-top:2px;}

.hud{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.hearts{display:flex; gap:3px;}
.heart{font-size:19px; filter:drop-shadow(0 0 4px rgba(232,90,56,0.35)); transition:transform .25s;}
.heart.empty{opacity:0.25; filter:none;}
.heart.shake{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.score-chip{
  display:flex; align-items:center; gap:6px;
  background:var(--panel); border:1px solid var(--panel-line);
  padding:6px 12px; border-radius:999px; font-weight:700; font-size:14px;
}
.score-chip b{color:var(--gold); font-family:'Baloo 2'; font-size:16px;}

.shop-btn{
  background:linear-gradient(135deg,var(--mint),var(--mint-dark));
  color:#0e2620; border:none; border-radius:999px; padding:8px 16px;
  font-weight:700; font-size:14px; box-shadow:0 3px 0 var(--mint-dark);
  transition:transform .1s;
}
.shop-btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--mint-dark);}

/* ---------- Body diagram ---------- */
.tract-outer{
  background:var(--panel); border:1px solid var(--panel-line); border-radius:var(--radius);
  padding:16px 10px 14px;
}
.tract-title{font-size:12px; color:var(--text-muted); padding:0 8px 10px; font-weight:700; letter-spacing:1px; text-align:center;}
.diagram-wrap{position:relative; width:100%; line-height:0; border-radius:12px; overflow:hidden;}
.diagram-img{width:100%; height:auto; display:block;}
.organ-marker{
  position:absolute; width:20px; height:20px; margin:-10px 0 0 -10px;
  border-radius:50%; border:3px solid var(--panel);
  transition:background .35s, opacity .35s, box-shadow .35s;
}
.organ-marker.status-upcoming{background:var(--panel-alt); opacity:0.6; box-shadow:none;}
.organ-marker.status-done{background:var(--mint); opacity:0.9; box-shadow:0 0 0 3px rgba(46,156,115,0.25);}
.organ-marker.status-current{background:var(--coral); opacity:1; box-shadow:0 0 0 7px rgba(232,90,56,0.3); animation:markerPulse 1.4s infinite;}
.organ-marker.status-active-gland{background:var(--gold); opacity:1; box-shadow:0 0 0 7px rgba(201,141,30,0.3); animation:markerPulse 1.4s infinite;}
@keyframes markerPulse{0%,100%{opacity:1;}50%{opacity:0.55;}}
.diagram-legend{display:flex; flex-wrap:wrap; gap:8px 16px; justify-content:center; margin-top:10px; font-size:11px; color:var(--text-muted);}
.legend-item{display:flex; align-items:center; gap:5px;}
.legend-dot{width:10px; height:10px; border-radius:50%; display:inline-block; flex-shrink:0;}
.dot-current{background:var(--coral);}
.dot-done{background:var(--mint);}
.dot-gland{background:var(--gold);}
.dot-upcoming{background:var(--panel-alt); border:1px solid var(--panel-line);}

/* ---------- Panel ---------- */
.panel{
  background:var(--panel); border:1px solid var(--panel-line); border-radius:var(--radius);
  padding:24px 20px; animation:fadein .35s ease;
}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* ---------- Menu screen ---------- */
.menu-hero{text-align:center; padding:10px 0 20px;}
.menu-hero .big-emoji{font-size:52px; margin-bottom:6px;}
.menu-hero h2{font-size:24px; font-weight:800; margin-bottom:6px;}
.menu-hero p{color:var(--text-muted); font-size:14px; line-height:1.6; max-width:440px; margin:0 auto;}
.diff-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:22px;}
@media(max-width:520px){.diff-grid{grid-template-columns:1fr;}}
.diff-card{
  border-radius:16px; padding:20px 16px; text-align:left; border:2px solid transparent;
  cursor:pointer; transition:transform .15s, border-color .15s; color:var(--text);
}
.diff-card:active{transform:scale(0.98);}
.diff-card.basic{background:linear-gradient(160deg, rgba(46,156,115,0.18), var(--panel-alt)); border-color:rgba(46,156,115,0.4);}
.diff-card.adv{background:linear-gradient(160deg, rgba(232,90,56,0.18), var(--panel-alt)); border-color:rgba(232,90,56,0.4);}
.diff-card h3{font-size:17px; margin-bottom:6px;}
.diff-card p{font-size:12.5px; color:var(--text-muted); line-height:1.6; margin:0;}
.diff-tag{display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; margin-bottom:8px;}
.basic .diff-tag{background:rgba(46,156,115,0.25); color:var(--mint);}
.adv .diff-tag{background:rgba(232,90,56,0.25); color:var(--coral);}

/* ---------- Organ question screen ---------- */
.food-banner{
  display:flex; align-items:center; gap:10px; background:var(--panel-alt); border:1px solid var(--panel-line);
  border-radius:999px; padding:7px 14px; margin-bottom:14px; width:fit-content;
}
.food-banner .fb-emoji{font-size:20px;}
.food-banner .fb-text{font-size:12.5px; color:var(--text-muted); font-weight:700;}
.food-banner .fb-text b{color:var(--text); font-weight:800;}
.food-banner .fb-badge{font-size:11px; font-weight:700; color:var(--mint); background:rgba(46,156,115,0.15); border:1px solid rgba(46,156,115,0.35); padding:3px 10px; border-radius:999px;}
.q-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px; gap:10px;}
.q-organ-name{font-size:19px; font-weight:800; display:flex; align-items:center; gap:8px;}
.q-progress{font-size:12px; color:var(--text-muted); font-weight:700; white-space:nowrap;}
.q-note{font-size:12.5px; color:var(--gold); background:rgba(201,141,30,0.1); border:1px solid rgba(201,141,30,0.25); border-radius:10px; padding:8px 10px; margin:10px 0 4px; line-height:1.5;}
.timerbar-outer{height:5px; background:var(--panel-alt); border-radius:3px; margin:16px 0 18px; overflow:hidden;}
.timerbar{height:100%; background:linear-gradient(90deg,var(--mint),var(--gold)); width:100%; transition:width .1s linear;}
.q-prompt{font-size:16px; font-weight:700; margin-bottom:16px; line-height:1.5;}
.opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(max-width:480px){.opt-grid{grid-template-columns:1fr;}}
.opt-btn{
  background:var(--panel-alt); border:2px solid var(--panel-line); color:var(--text);
  border-radius:12px; padding:13px 14px; font-size:14.5px; font-weight:600; text-align:left;
  transition:all .15s;
}
.opt-btn:hover:not(:disabled){border-color:rgba(255,255,255,0.3);}
.opt-btn:disabled{cursor:default;}
.opt-btn.correct-flash{background:rgba(46,156,115,0.28); border-color:var(--mint); box-shadow:0 0 12px rgba(46,156,115,0.4);}
.opt-btn.wrong-flash{background:rgba(209,79,69,0.25); border-color:var(--danger);}
.opt-btn.hint-glow{border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,141,30,0.25); animation:pulse 1s infinite;}
.chk-pill.hint-glow{border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,141,30,0.25); animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(201,141,30,0.25);}50%{box-shadow:0 0 0 6px rgba(201,141,30,0.12);}}
.nutrient-box{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px;}
.match-grid{display:flex; flex-direction:column; gap:10px; margin-bottom:16px;}
.match-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  background:var(--panel-alt); border:1px solid var(--panel-line); border-radius:12px; padding:10px 12px;
}
.match-gland{font-size:14px; font-weight:700; min-width:90px;}
.match-sub{font-size:11px; color:var(--text-muted); font-weight:400; margin-left:4px;}
.match-opts{display:flex; gap:6px; flex-wrap:wrap;}
.match-opt{
  background:var(--panel); border:2px solid var(--panel-line); color:var(--text);
  border-radius:9px; padding:8px 12px; font-size:13px; font-weight:600; transition:all .15s;
}
.match-opt.selected{border-color:var(--mint); background:rgba(46,156,115,0.22); box-shadow:0 0 8px rgba(46,156,115,0.3);}
.match-opt:disabled{opacity:0.7;}
.chk-pill{
  display:flex; align-items:center; gap:8px; background:var(--panel-alt); border:2px solid var(--panel-line);
  padding:11px 16px; border-radius:999px; font-weight:600; font-size:14.5px; user-select:none;
}
.chk-pill.checked{border-color:var(--mint); background:rgba(46,156,115,0.18);}
.chk-pill input{width:16px; height:16px; accent-color:var(--mint);}
.submit-btn{
  background:linear-gradient(135deg,var(--coral),var(--coral-dark)); color:#2a0e07; border:none;
  padding:12px 22px; border-radius:12px; font-weight:800; font-size:14.5px; box-shadow:0 3px 0 var(--coral-dark);
}
.submit-btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--coral-dark);}
.submit-btn:disabled{opacity:0.4; box-shadow:none;}
.feedback-banner{
  margin-top:16px; padding:12px 14px; border-radius:12px; font-size:14px; font-weight:700; line-height:1.6;
  animation:fadein .25s ease;
}
.feedback-banner.ok{background:rgba(46,156,115,0.2); color:var(--mint); border:1px solid rgba(46,156,115,0.4);}
.feedback-banner.bad{background:rgba(209,79,69,0.14); color:var(--danger); border:1px solid rgba(209,79,69,0.4);}

/* ---------- Settlement screen ---------- */
.food-hero{text-align:center; margin-bottom:18px;}
.food-hero .fe{font-size:44px;}
.food-hero h2{font-size:20px; font-weight:800; margin-top:4px;}
.food-hero p{color:var(--text-muted); font-size:12.5px; margin-top:4px;}
.nutri-table{width:100%; border-collapse:collapse; margin:14px 0 18px; font-size:14px;}
.nutri-table th{text-align:left; font-size:11px; color:var(--text-muted); font-weight:700; padding:6px 8px; border-bottom:1px solid var(--panel-line);}
.nutri-table td{padding:9px 8px; border-bottom:1px solid var(--panel-line);}
.settle-amt{font-size:11.5px; color:var(--text-muted); font-weight:400; margin-left:2px;}
.formula-box{background:var(--panel-alt); border:1px solid var(--panel-line); border-radius:12px; padding:12px 14px; font-size:13px; color:var(--text-muted); margin-bottom:16px; line-height:1.7;}
.formula-box b{color:var(--text);}
.calc-row{display:flex; gap:10px; flex-wrap:wrap;}
.calc-row input{
  flex:1; min-width:140px; background:var(--panel-alt); border:2px solid var(--panel-line); color:var(--text);
  padding:12px 14px; border-radius:12px; font-size:16px; font-family:'Baloo 2';
}
.calc-row input:focus{outline:none; border-color:var(--gold);}

.calc-section{
  background:var(--panel-alt); border:1px solid var(--panel-line); border-radius:14px;
  padding:14px 16px; margin-bottom:14px;
}
.calc-section.answer-section{background:rgba(46,156,115,0.10); border-color:rgba(46,156,115,0.35);}
.calc-section-title{font-size:14px; font-weight:800; margin-bottom:4px;}
.calc-section-sub{font-size:12px; color:var(--text-muted); margin-bottom:10px;}
.calc-scratch{
  width:100%; background:var(--panel); border:2px solid var(--panel-line); color:var(--text);
  padding:10px 12px; border-radius:12px; font-size:14px; font-family:'Baloo 2','Noto Sans TC',sans-serif;
  resize:vertical; line-height:1.6;
}
.calc-scratch:focus{outline:none; border-color:var(--gold);}
.calc-scratch::placeholder{color:var(--text-muted); font-family:'Noto Sans TC',sans-serif;}

/* ---------- Gameover ---------- */
.gameover{text-align:center; padding:26px 10px;}
.gameover .ge{font-size:60px;}
.gameover h2{font-size:22px; margin:10px 0 6px; color:var(--danger);}
.gameover p{color:var(--text-muted); font-size:14px; margin-bottom:6px;}
.gameover .final-score{font-family:'Baloo 2'; font-size:34px; color:var(--gold); margin:10px 0 20px;}
.restart-btn{
  background:linear-gradient(135deg,var(--gold),var(--gold-dark)); color:#3a2500; border:none;
  padding:13px 26px; border-radius:12px; font-weight:800; font-size:15px; box-shadow:0 3px 0 var(--gold-dark);
}

/* ---------- Shop modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,5,4,0.72); display:flex; align-items:flex-end;
  justify-content:center; z-index:50; animation:fadein .2s ease;
}
@media(min-width:600px){.modal-overlay{align-items:center;}}
.modal{
  background:var(--panel); border:1px solid var(--panel-line); border-radius:20px 20px 0 0;
  width:100%; max-width:480px; padding:22px 18px 26px; max-height:86vh; overflow-y:auto;
}
@media(min-width:600px){.modal{border-radius:20px;}}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
.modal-head h3{font-size:18px; font-weight:800;}
.shop-balance{
  font-size:13px; color:var(--text-muted); font-weight:700; background:var(--panel-alt);
  border:1px solid var(--panel-line); border-radius:10px; padding:8px 12px; margin-bottom:14px;
}
.shop-balance b{color:var(--gold); font-family:'Baloo 2'; font-size:16px;}
.close-x{background:var(--panel-alt); border:none; color:var(--text); width:38px; height:38px; border-radius:50%; font-size:16px;}
.shop-item{
  display:flex; align-items:center; gap:12px; background:var(--panel-alt); border:1px solid var(--panel-line);
  border-radius:14px; padding:12px 14px; margin-bottom:10px;
}
.shop-item .ic{font-size:26px;}
.shop-item .info{flex:1;}
.shop-item .info h4{font-size:14.5px; font-weight:700; margin-bottom:2px;}
.shop-item .info p{font-size:11.5px; color:var(--text-muted); margin:0; line-height:1.5;}
.buy-btn{
  background:var(--mint); color:#0e2620; border:none; padding:9px 14px; border-radius:10px;
  font-weight:800; font-size:12.5px; white-space:nowrap; box-shadow:0 2px 0 var(--mint-dark);
}
.buy-btn:disabled{background:#585048; color:#9c9088; box-shadow:none;}
.shop-note{font-size:11.5px; color:var(--text-muted); text-align:center; margin-top:6px;}

/* ---------- Wrong-answer modal ---------- */
.wrong-modal{text-align:center; padding:30px 22px; max-width:380px;}
.wrong-icon{font-size:48px; animation:shake .5s;}
.wrong-modal h3{font-size:19px; color:var(--danger); margin:10px 0 12px;}
.wrong-correct{font-size:15px; margin:0 0 6px; line-height:1.6;}
.wrong-correct b{color:var(--gold);}
.wrong-sub{font-size:13px; color:var(--text-muted); margin:0 0 20px;}
.wrong-continue-btn{width:100%;}
.hint-modal .wrong-icon{animation:pulse 1s infinite;}
.hint-modal h3{color:var(--gold);}
.hint-modal .wrong-correct{margin-bottom:22px;}
</style>
</head>

/* ============ HELPERS ============ */
function shuffled(arr){ return [...arr].sort(()=>Math.random()-0.5); }
function kcalOf(f){ return f.carbs*4 + f.protein*4 + f.fat*9; }
const NUTRIENT_KEY_MAP={'醣類':'carbs','蛋白質':'protein','脂質':'fat'};
function foodHasNutrient(food, nutrientName){ return food[NUTRIENT_KEY_MAP[nutrientName]]>0; }
function foodNutrientLabel(food){
  const list=[];
  if(food.carbs>0) list.push('醣類');
  if(food.protein>0) list.push('蛋白質');
  if(food.fat>0) list.push('脂質');
  return list.join('、');
}
function chemCorrectAnswer(organ, food){
  if(!organ.nutrients || organ.nutrients.length===0) return '否';
  return organ.nutrients.some(n=>foodHasNutrient(food,n)) ? '是' : '否';
}
const DISTRACTOR_AMOUNTS={
  '水分':'80 g','維生素C':'15 mg','維生素E':'10 mg','維生素':'12 mg','礦物質':'1.2 g','纖維質':'3 g'
};
function buildSettlementItems(f){
  const items=[];
  if(f.carbs>0) items.push({name:'醣類', amount:f.carbs+' g', isEnergy:true});
  if(f.protein>0) items.push({name:'蛋白質', amount:f.protein+' g', isEnergy:true});
  if(f.fat>0) items.push({name:'脂質', amount:f.fat+' g', isEnergy:true});
  f.distractors.forEach(d=>{
    items.push({name:d, amount: DISTRACTOR_AMOUNTS[d] || '少量', isEnergy:false});
  });
  return shuffled(items);
}
function currentOrgan(){ return ORGANS[state.organIndex]; }
function currentQType(){ return state.qList[state.qIndex]; }
function pointsFor(qType){
  if(qType==='nutrient') return NUTRIENT_POINTS;
  return Q_POINTS[state.difficulty];
}

function buildQList(organ){
  const digestedHere = chemCorrectAnswer(organ, state.food) === '是';
  if(organ.isSmallIntestine){
    const qs=['chem'];
    if(digestedHere){
      qs.push('pH','si_match');
      ['醣類','蛋白質','脂質'].forEach(n=>{
        if(foodHasNutrient(state.food, n)) qs.push('si_enzyme:'+n);
      });
    }
    return qs;
  }
  const qs=['chem'];
  if(organ.askGlandPH && digestedHere){
    qs.push('pH','gland');
    if(organ.askNutrient && state.difficulty==='advanced') qs.push('nutrient');
  }
  return qs;
}

function startNewRound(difficulty){
  const pool = FOODS[difficulty];
  const food = pool[Math.floor(Math.random()*pool.length)];
  state.difficulty=difficulty; state.food=food;
  state.organIndex=0; state.qIndex=0;
  state.qList=buildQList(ORGANS[0]);
  state.hintUsesThisRound=0; state.hintActive=false;
  state.answered=false;
  state.glandShuffled=shuffled(GLAND_OPTIONS);
  state.screen='organ';
  render(); startTimer();
}

function nextQuestion(){
  state.qIndex++;
  state.answered=false; state.hintActive=false;
  if(state.qIndex>=state.qList.length){
    // move to next organ
    state.organIndex++;
    if(state.organIndex>=ORGANS.length){
      state.screen='settlement';
      state.settleStep='select';
      state.settleItems=buildSettlementItems(state.food);
      render();
      return;
    }
    state.qIndex=0;
    state.qList=buildQList(currentOrgan());
    state.glandShuffled=shuffled(GLAND_OPTIONS);
  }
  render(); startTimer();
}

function loseHeart(){
  state.hp=Math.max(0,state.hp-1);
  if(state.hp<=0){
    stopTimer();
    state.screen='gameover';
  }
}

function startTimer(){
  stopTimer();
  state.speedEligible=true; state.timerPct=100;
  const start=Date.now();
  timerHandle=setInterval(()=>{
    const elapsed=Date.now()-start;
    const pct=Math.max(0,100-(elapsed/SPEED_WINDOW_MS)*100);
    state.timerPct=pct;
    if(pct<=0){ state.speedEligible=false; }
    const bar=document.getElementById('timerbar');
    if(bar){ bar.style.width=pct+'%'; }
    else { stopTimer(); }
  },100);
}
function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } }

/* ============ ANSWER HANDLERS ============ */
function answerSingle(qType, chosen, correct){
  if(state.answered) return;
  state.answered=true;
  const isCorrect = chosen===correct;
  const btns=document.querySelectorAll('.opt-btn');
  btns.forEach(b=>{
    b.disabled=true;
    if(b.dataset.val===correct) b.classList.add('correct-flash');
    else if(b.dataset.val===chosen && !isCorrect) b.classList.add('wrong-flash');
  });
  stopTimer();
  if(isCorrect){
    let earned=pointsFor(qType);
    if(state.speedEligible) earned+=SPEED_BONUS;
    state.score+=earned;
    showCorrectFeedback(earned);
    setTimeout(()=>{ if(state.screen==='organ') nextQuestion(); else render(); }, 1100);
  } else {
    loseHeart();
    openWrongModal(correct, 'nextQuestion');
  }
}

function answerNutrient(selected, correctSet){
  if(state.answered) return;
  state.answered=true;
  const a=[...selected].sort().join(',');
  const b=[...correctSet].sort().join(',');
  const isCorrect = a===b;
  stopTimer();
  if(isCorrect){
    let earned=pointsFor('nutrient');
    if(state.speedEligible) earned+=SPEED_BONUS;
    state.score+=earned;
    showCorrectFeedback(earned);
    setTimeout(()=>{ if(state.screen==='organ') nextQuestion(); else render(); }, 1100);
  } else {
    loseHeart();
    openWrongModal(correctSet.join('、'), 'nextQuestion');
  }
}

function answerMatch(){
  if(state.answered) return;
  state.answered=true;
  const organ=currentOrgan();
  const isCorrect = organ.glands.every(g=>matchSelections[g.gland]===g.juice);
  stopTimer();
  document.querySelectorAll('.match-opt').forEach(b=>b.disabled=true);
  const submitMatch=document.getElementById('submitMatch'); if(submitMatch) submitMatch.disabled=true;
  if(isCorrect){
    let earned=pointsFor('si_match');
    if(state.speedEligible) earned+=SPEED_BONUS;
    state.score+=earned;
    showCorrectFeedback(earned);
    setTimeout(()=>{ if(state.screen==='organ') nextQuestion(); else render(); }, 1100);
  } else {
    loseHeart();
    const label = organ.glands.map(g=>`${g.gland}→${g.juice}`).join('、');
    openWrongModal(label, 'nextQuestion');
  }
}

function answerEnzyme(nutrient, selected){
  if(state.answered) return;
  state.answered=true;
  const organ=currentOrgan();
  const correctSet = organ.glands.filter(g=>g.enzymes.includes(nutrient)).map(g=>g.juice);
  const a=[...selected].sort().join(',');
  const b=[...correctSet].sort().join(',');
  const isCorrect = a===b;
  stopTimer();
  if(isCorrect){
    let earned=pointsFor('si_enzyme');
    if(state.speedEligible) earned+=SPEED_BONUS;
    state.score+=earned;
    showCorrectFeedback(earned);
    setTimeout(()=>{ if(state.screen==='organ') nextQuestion(); else render(); }, 1100);
  } else {
    loseHeart();
    const label = correctSet.length ? `能分解${nutrient}的是：${correctSet.join('、')}（其餘皆不行）` : `三種消化液都不能分解${nutrient}`;
    openWrongModal(label, 'nextQuestion');
  }
}

function showCorrectFeedback(earned){
  const zone=document.getElementById('feedbackZone');
  if(zone) zone.innerHTML = `<div class="feedback-banner ok">✅ 答對了！${earned?('+ '+earned+' 分'):''}</div>`;
}

/* ============ WRONG-ANSWER MODAL ============ */
function openWrongModal(correctLabel, actionType){
  const hearts=document.querySelectorAll('.heart');
  hearts.forEach(h=>{ h.classList.add('shake'); setTimeout(()=>h.classList.remove('shake'),400); });
  state.wrongModal={correctLabel, actionType};
  render();
}
function closeWrongModal(){
  const action = state.wrongModal ? state.wrongModal.actionType : null;
  state.wrongModal=null;
  if(state.screen==='gameover'){ render(); return; }
  if(action==='nextQuestion'){ nextQuestion(); }
  else { render(); }
}

/* ============ SETTLEMENT ============ */
function answerSettleSelect(){
  const box=document.getElementById('settleSelectBox');
  const selected=[...box.querySelectorAll('input:checked')].map(i=>i.value);
  const correctSet=state.settleItems.filter(it=>it.isEnergy).map(it=>it.name);
  const a=[...selected].sort().join(',');
  const b=[...correctSet].sort().join(',');
  if(a===b){
    state.settleStep='calc';
    render();
  } else {
    loseHeart();
    openWrongModal(correctSet.join('、'), 'retrySettleSelect');
  }
}

function submitKcal(){
  const zone=document.getElementById('settleFeedback');
  const input=document.getElementById('kcalInput');
  const val=parseInt(input.value,10);
  const correct=kcalOf(state.food);
  if(val===correct){
    state.score+=correct;
    if(zone) zone.innerHTML=`<div class="feedback-banner ok">🎉 正確！這道食物提供 <b>${correct} 大卡</b>，已加入你的總分！</div>`;
    setTimeout(()=>{
      state.hintActive=false;
      state.screen='menu';
      render();
    },1300);
  } else {
    loseHeart();
    openWrongModal(correct+' 大卡', 'retrySettleCalc');
  }
}

/* ============ SHOP ============ */
function toggleShop(open){ state.shopOpen=open; render(); }
function buyHeart(type){
  const item=SHOP[type];
  if(state.score<item.price || state.hp>=MAX_HP) return;
  state.score-=item.price;
  state.hp=Math.min(MAX_HP, state.hp+item.heal);
  render();
}
function buyHint(){
  if(state.hintUsesThisRound>=3) return;
  const price=SHOP.hintPrices[state.hintUsesThisRound];
  if(state.score<price) return;
  if(state.screen!=='organ' && state.screen!=='settlement') return;
  state.score-=price;
  state.hintUsesThisRound+=1;
  state.hintActive=true;
  state.shopOpen=false;
  state.hintModalOpen=true;
  render();
}
function closeHintModal(){
  state.hintModalOpen=false;
  render();
}

/* ============ RESTART ============ */
function restartGame(){
  state={screen:'menu',hp:5,score:0,difficulty:null,food:null,organIndex:0,qList:[],qIndex:0,
    hintUsesThisRound:0,hintActive:false,answered:false,shopOpen:false,glandShuffled:null,speedEligible:true,timerPct:100,
    wrongModal:null,hintModalOpen:false,settleStep:'select',settleItems:[]};
  render();
}

  const layout = `<div class="game-layout">${diagram ? `<div class="diagram-col">${diagram}</div>` : ''}<div class="content-col">${screenHtml()}</div></div>`;
  app.innerHTML = topBarHtml() + layout + (state.shopOpen?shopHtml():'') + (state.wrongModal?wrongModalHtml():'') + (state.hintModalOpen?hintModalHtml():'');
  bindEvents();
}

function organStatusClass(idx){
  if(state.screen==='menu') return 'status-upcoming';
  if(idx<state.organIndex) return 'status-done';

  return 'status-upcoming';
}

function glandStatusClass(){
  if(state.screen==='menu') return 'status-upcoming';
  const siIdx = ORGANS.findIndex(o=>o.isSmallIntestine);

  if(state.organIndex>siIdx) return 'status-done';
  return 'status-upcoming';
}

function organHtml(){
  const o=currentOrgan();

  if(qType==='chem'){
    const correct = chemCorrectAnswer(o, state.food);
    let prompt;
    if(o.nutrients && o.nutrients.length){
      prompt = `參考上方「${state.food.name}」含有的養分，這裡分泌的消化液，是否含有酵素，能對它進行化學消化？`;
    } else {
      prompt = `「${state.food.name}」在【${o.short}】會不會被消化？`;
    }
    body = optionQuestionHtml('chem', prompt, ['是','否'], correct);
  } else if(qType==='pH'){
    body = optionQuestionHtml('pH', `${o.short}的環境酸鹼值是？`, ['酸性','中性','鹼性'], o.pH);
  } else if(qType==='gland'){
    const opts = state.glandShuffled.map(g=>`${g.gland}→${g.juice}`);
    body = optionQuestionHtml('gland', `${o.short}分泌的消化腺與消化液，正確配對是？`, opts, `${o.gland}→${o.juice}`);

    body = siMatchHtml(o);

  }).join('');
  return `<div class="q-prompt">${prompt}</div><div class="opt-grid" id="optGrid">${opts}</div>`;

        <div class="ic">💗</div>
        <div class="info"><h4>小愛心卡・${SHOP.smallHeart.price} 大卡</h4><p>恢復 1 顆❤️（滿血無法購買）</p></div>
        <button class="buy-btn" id="buySmall" ${smallDisabled?'disabled':''}>購買</button>
      </div>
      <div class="shop-item">
        <div class="ic">💖</div>
        <div class="info"><h4>大愛心卡・${SHOP.largeHeart.price} 大卡</h4><p>恢復 2 顆❤️（滿血無法購買）</p></div>
        <button class="buy-btn" id="buyLarge" ${largeDisabled?'disabled':''}>購買</button>
      </div>
      <div class="shop-item">
        <div class="ic">💡</div>
        <div class="info"><h4>提示卡・${hintPrice!==null?hintPrice+' 大卡':'本回合已用完'}</h4><p>本回合第 ${Math.min(hintIdx+1,3)} 次使用（每回合限 3 次，價格遞增）。闖關時高亮正解，結算選擇成分時高亮會產熱的項目。</p></div>
        <button class="buy-btn" id="buyHint" ${hintDisabled?'disabled':''}>購買</button>
      </div>
      <div class="shop-note">道具只能在「闖關中」或「能量結算」時發揮效果</div>
    </div>
  </div>`;
}

/* ============ EVENT BINDING ============ */
function bindEvents(){
  const openShop=document.getElementById('openShop');
  if(openShop) openShop.onclick=()=>toggleShop(true);
  const closeShop=document.getElementById('closeShop');
  if(closeShop) closeShop.onclick=()=>toggleShop(false);
  const overlay=document.getElementById('modalOverlay');
  if(overlay) overlay.addEventListener('click', e=>{ if(e.target===overlay) toggleShop(false); });

  const buySmall=document.getElementById('buySmall');
  if(buySmall) buySmall.onclick=()=>buyHeart('smallHeart');
  const buyLarge=document.getElementById('buyLarge');
  if(buyLarge) buyLarge.onclick=()=>buyHeart('largeHeart');
  const buyHintBtn=document.getElementById('buyHint');
  if(buyHintBtn) buyHintBtn.onclick=buyHint;

  const pickBasic=document.getElementById('pickBasic');
  if(pickBasic) pickBasic.onclick=()=>startNewRound('basic');
  const pickAdv=document.getElementById('pickAdv');
  if(pickAdv) pickAdv.onclick=()=>startNewRound('advanced');

  document.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.onclick=()=>answerSingle(btn.dataset.qtype, btn.dataset.val, btn.dataset.correct);
  });

  const nutrientBox=document.getElementById('nutrientBox');
  if(nutrientBox){
    nutrientBox.querySelectorAll('.chk-pill').forEach(pill=>{
      pill.addEventListener('click', e=>{
        if(e.target.tagName!=='INPUT'){
          const cb=pill.querySelector('input');
          cb.checked=!cb.checked;
        }
        pill.classList.toggle('checked', pill.querySelector('input').checked);
      });
    });
    const submitNutrient=document.getElementById('submitNutrient');
    if(submitNutrient){
      submitNutrient.onclick=()=>{
        const selected=[...nutrientBox.querySelectorAll('input:checked')].map(i=>i.value);
        answerNutrient(selected, currentOrgan().nutrients);
      };
    }
  }

  const settleSelectBox=document.getElementById('settleSelectBox');
  if(settleSelectBox){
    settleSelectBox.querySelectorAll('.chk-pill').forEach(pill=>{
      pill.addEventListener('click', e=>{
        if(e.target.tagName!=='INPUT'){
          const cb=pill.querySelector('input');
          cb.checked=!cb.checked;
        }
        pill.classList.toggle('checked', pill.querySelector('input').checked);
      });
    });
    const submitSettleSelect=document.getElementById('submitSettleSelect');
    if(submitSettleSelect) submitSettleSelect.onclick=answerSettleSelect;
  }

  const matchGrid=document.getElementById('matchGrid');
  if(matchGrid){
    matchGrid.querySelectorAll('.match-opt').forEach(btn=>{
      btn.onclick=()=>{
        const row=btn.dataset.row;
        matchGrid.querySelectorAll(`.match-opt[data-row="${row}"]`).forEach(b=>b.classList.remove('selected'));
        btn.classList.add('selected');
        matchSelections[row]=btn.dataset.val;
        const submitMatch=document.getElementById('submitMatch');
        if(submitMatch) submitMatch.disabled = Object.keys(matchSelections).length < currentOrgan().glands.length;
      };
    });
    const submitMatch=document.getElementById('submitMatch');
    if(submitMatch) submitMatch.onclick=answerMatch;
  }

  const lipidBox=document.getElementById('lipidBox');
  if(lipidBox){
    lipidBox.querySelectorAll('.chk-pill').forEach(pill=>{
      pill.addEventListener('click', e=>{
        if(e.target.tagName!=='INPUT'){
          const cb=pill.querySelector('input');
          cb.checked=!cb.checked;
        }
        pill.classList.toggle('checked', pill.querySelector('input').checked);
      });
    });
    const submitLipid=document.getElementById('submitLipid');
    if(submitLipid){
      submitLipid.onclick=()=>{
        const selected=[...lipidBox.querySelectorAll('input:checked')].map(i=>i.value);
        const nutrient = currentQType().split(':')[1];
        answerEnzyme(nutrient, selected);
      };
    }
  }

  const submitKcalBtn=document.getElementById('submitKcal');
  if(submitKcalBtn) submitKcalBtn.onclick=submitKcal;
  const kcalInput=document.getElementById('kcalInput');
  if(kcalInput) kcalInput.addEventListener('keydown', e=>{ if(e.key==='Enter') submitKcal(); });

  const restartBtn=document.getElementById('restartBtn');
  if(restartBtn) restartBtn.onclick=restartGame;

  const wrongContinueBtn=document.getElementById('wrongContinueBtn');
  if(wrongContinueBtn) wrongContinueBtn.onclick=closeWrongModal;

  const hintContinueBtn=document.getElementById('hintContinueBtn');
  if(hintContinueBtn) hintContinueBtn.onclick=closeHintModal;
}

render();
</script>
</body>
</html>
