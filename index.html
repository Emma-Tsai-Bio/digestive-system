/* 每個關卡用自己的底圖；圖片確定載入成功才換上，並把暗色遮罩調淡讓圖片看得見 */
function bgKey(){
  if(state.screen === 'warmup') return 'warmup';
  if(state.screen === 'lab') return state.lab.mode;
  if(state.screen === 'organ') return currentOrgan().key;
  if(state.screen === 'settlement' || state.screen === 'intermission') return 'settle';
  return 'lobby';
}
let currentBg = null;
function applyBg(src){
  const stage = document.getElementById('bgStage');
  if(!stage) return;
  if(src){
    const u = `url("${src}")`;
    stage.querySelector('.bg-blur').style.backgroundImage = u;
    stage.querySelector('.bg-sharp').style.backgroundImage = u;
    stage.classList.add('on');
  } else {
    stage.classList.remove('on');
  }
}
function setBackground(src){
  if(src === currentBg) return;
  currentBg = src;
  if(!src || BAD_IMG.has(src)){ applyBg(null); return; }
  const im = new Image();
  im.onload = ()=>{ if(currentBg === src) applyBg(src); };
  im.onerror = ()=>{ BAD_IMG.add(src); if(currentBg === src) applyBg(null); };
  im.src = src;
}

let lastRenderedScreen = null;
function render(){
  const tk = themeKey();
  document.documentElement.style.setProperty('--trgb', THEMES[tk].rgb);
  setBackground(ASSETS.background[bgKey()]);

  const showMap = !['ending','login','warmup','lab'].includes(state.screen);
  const app = document.getElementById('app');
  app.innerHTML =
    topBarHtml() +
    `<div class="game-layout">
      ${showMap ? `<div class="map-col">${mapHtml()}</div>` : ''}
      <div class="content-col">${wizardHtml()}${screenHtml(tk)}</div>
    </div>` +
    (state.shopOpen ? shopHtml() : '') +
    (state.codexOpen ? codexHtml() : '') +
    (state.leaderOpen ? leaderHtml() : '') +
    (state.wrongModal ? wrongModalHtml() : '') +
    (state.hintModalOpen ? hintModalHtml() : '');
  app.classList.toggle('steady', lastRenderedScreen === state.screen);
  lastRenderedScreen = state.screen;
  bindEvents();
}

function fxHtml(tk){
  const t = THEMES[tk];
  let parts = '';
  const dir = t.fx === 'fall' || t.kind === 'drip' ? 'fall' : 'rise';
  for(let i=0;i<t.n;i++){
    const left = (i*37 + 11) % 100;
    const size = t.kind==='bubble' ? 8 + (i*5)%14 : t.kind==='dust' ? 3 + i%3 : t.kind==='drip' ? 5 + i%4 : 4 + i%4;
    const dur = (t.kind==='bubble' ? 5 : 7) + (i*1.3)%5;
    const delay = -((i*1.7) % dur);
    const h = t.kind==='drip' ? size*1.6 : size;
    parts += `<span class="pt ${dir} ${t.kind}" style="left:${left}%; width:${size}px; height:${h}px; animation-duration:${dur.toFixed(1)}s; animation-delay:${delay.toFixed(1)}s;"></span>`;
  }
  const flowCls = t.fx === 'flow' ? ' fx-flow' : '';
  const rune = t.fx === 'rune' ? '<div class="rune"></div>' : '';
  return `<div class="fx${flowCls}"><div class="fx-glow"></div>${rune}${parts}</div>`;
}

    const rows = b.top.map(r=>`
      <tr class="${r.me?'me ':''}${r.rank<=3?'top'+r.rank:''}">

const ORGAN_MARKERS = [
  {key:'mouth', x:36.6, y:17.6}, {key:'pharynx', x:49.3, y:20.2}, {key:'esophagus', x:52.7, y:37.4},
  {key:'stomach', x:66.9, y:55.0}, {key:'liver', x:41.0, y:53.1}, {key:'pancreas', x:62.0, y:62.2},
  {key:'si', x:43.0, y:69.0}, {key:'large', x:38.1, y:79.1}, {key:'anus', x:51.8, y:93.1}
];
function organStatus(idx){
  if(state.screen === 'organ'){
    if(idx < state.organIndex) return 'done';
    if(idx === state.organIndex) return 'current';
    return 'upcoming';
  }
  if(state.screen === 'settlement' || state.screen === 'intermission') return 'done';
  return 'upcoming';
}
function glandStatus(){
  const si = ORGANS.findIndex(o=>o.isSmallIntestine);
  if(state.screen === 'organ'){
    if(state.organIndex === si) return 'active-gland';
    if(state.organIndex > si) return 'done';
    return 'upcoming';
  }
  if(state.screen === 'settlement' || state.screen === 'intermission') return 'done';
  return 'upcoming';
}
function mapHtml(){
  const g = glandStatus();
  const cls = {mouth:organStatus(0), pharynx:organStatus(1), esophagus:organStatus(2), stomach:organStatus(3),
    liver:g, pancreas:g, si:organStatus(4), large:organStatus(5), anus:organStatus(6)};
  const markers = ORGAN_MARKERS.map(m=>`<div class="organ-marker status-${cls[m.key]}" style="left:${m.x}%; top:${m.y}%;"></div>`).join('');
  const d = ASSETS.diagram;
  const diagram = BAD_IMG.has(d) ? '' :
    `<div class="diagram-wrap"><img src="${d}" class="diagram-img" alt="消化系統地圖" onerror="markBad(this,'${d}'); this.closest('.diagram-wrap').remove();">${markers}</div>`;
  const dotColor = {done:'var(--green)', current:'var(--red)', upcoming:'#6b5e4f'};
  const path = ORGANS.map((o,i)=>{
    const s = organStatus(i);
    return `<li class="p-${s}"><i class="dot" style="background:${dotColor[s]}"></i>${o.icon} ${o.name}<small>${o.stage}</small></li>`;
  }).join('');
  return `
  <div class="panel map-panel">
    <div class="map-title">地下城地圖<small>DUNGEON MAP</small></div>
    ${diagram}
    <ul class="path-list">${path}</ul>
    <div class="map-legend">
      <span class="legend-item"><i class="legend-dot" style="background:var(--red)"></i>所在層</span>
      <span class="legend-item"><i class="legend-dot" style="background:var(--gold)"></i>援軍腺體</span>
      <span class="legend-item"><i class="legend-dot" style="background:var(--green)"></i>已攻略</span>
    </div>
  </div>`;
}

/* ---------- 魔物料理展示 ---------- */
function showcaseHtml(){
  const f = state.food;
  const qt = state.screen === 'organ' ? currentQType() : '';
  const target = qt && qt.startsWith('si_enzyme:') ? qt.split(':')[1] : null;

    return `<div class="mon${cls}">${n === target ? '<div class="mon-arrow">⬇ 正在分解</div>' : ''}${pic(ASSETS.monsters[m.key], m.emoji, 'mon-pic')}<div class="mon-cap">${m.name}<small>（${n}）</small></div></div>`;

  return `
  <div class="showcase">
    <div class="show-food">

      <div class="run-progress">料理 ${state.runIndex+1} / ${DISHES_PER_RUN}</div>
    </div>
    <div class="show-vs">⚔️</div>
    <div class="show-mons">${mons}</div>
  </div>`;

/* ---------- 關卡題目 ---------- */
function organHtml(tk){
  const o = currentOrgan();
  const qType = currentQType();
  let body = '';
  if(qType === 'chem'){
    const correct = chemCorrectAnswer(o, state.food);
    const prompt = o.nutrients && o.nutrients.length
      ? `「${state.food.name}」帶著魔物闖入了【${stageLabel(o)}】。這裡分泌的消化液，是否含有酵素，能對它施展化學消化？`
      : `「${state.food.name}」來到了【${stageLabel(o)}】。這裡會對它進行化學消化嗎？`;
    body = optionQuestionHtml('chem', prompt,
      [{val:'是', label:'✨ 施放消化魔法！'}, {val:'否', label:'🛑 不消化，放它通過'}], correct);
  } else if(qType === 'pH'){
    body = optionQuestionHtml('pH', `以魔力感知【${stageLabel(o)}】的環境，這裡的酸鹼值是？`,
      [{val:'酸性', label:'🔥 判定：酸性'}, {val:'中性', label:'⚖️ 判定：中性'}, {val:'鹼性', label:'💠 判定：鹼性'}], o.pH);
  } else if(qType === 'gland'){
    const opts = state.glandShuffled.map(g=>({val:`${g.gland}→${g.juice}`, label:`🔮 召喚 ${g.gland} → ${g.juice}`}));
    body = optionQuestionHtml('gland', `召喚守護此地的消化腺，並選出它分泌的消化液：`, opts, `${o.gland}→${o.juice}`);
  } else if(qType === 'si_match'){
    body = siMatchHtml(o);
  } else if(qType.startsWith('si_enzyme:')){
    body = siEnzymeHtml(o, qType.split(':')[1]);
  } else if(qType === 'nutrient'){
    body = nutrientQuestionHtml(o);
  }
  return `
  <div class="panel stage">
    ${fxHtml(tk)}
    ${showcaseHtml()}
    <div class="q-head">
      <div class="q-stage">${o.icon} ${o.name}<small>（${o.stage}）</small></div>
      <div class="q-progress">FLOOR ${state.organIndex+1} / ${ORGANS.length}</div>
    </div>
    ${o.note ? `<div class="q-note">📜 ${o.note}</div>` : ''}
    <div class="timer-label">⚡ 速攻時限</div>
    <div class="timerbar-outer"><div class="timerbar" id="timerbar" style="width:${state.timerPct}%"></div></div>
    ${body}
    <div id="feedbackZone"></div>
  </div>`;
}

function optionQuestionHtml(qType, prompt, options, correct){
  const btns = options.map(opt=>{
    const hint = state.hintActive && opt.val === correct ? ' hint-glow' : '';
    return `<button class="opt-btn${hint}" data-val="${opt.val}" data-qtype="${qType}" data-correct="${correct}">${opt.label}</button>`;
  }).join('');
  return `<div class="q-prompt">${prompt}</div><div class="opt-grid">${btns}</div>`;
}

function pillsHtml(boxId, items, correctVals){
  const pills = items.map(it=>{
    const hint = state.hintActive && correctVals.includes(it.val) ? ' hint-glow' : '';
    return `<label class="chk-pill${hint}"><input type="checkbox" value="${it.val}"> ${it.label}</label>`;
  }).join('');
  return `<div class="nutrient-box" id="${boxId}">${pills}</div>`;
}

function nutrientQuestionHtml(o){
  const correct = o.nutrients.filter(n=>foodHasNutrient(state.food, n));
  const items = ['醣類','蛋白質','脂質'].map(n=>({val:n, label:monLabel(n)}));
  return `
  <div class="q-prompt">此刻在【${stageLabel(o)}】，哪些魔物正在被分解？（可複選）</div>
  ${pillsHtml('nutrientBox', items, correct)}
  <button class="cast-btn" id="submitNutrient">⚡ 發動分解術！</button>`;
}

function siMatchHtml(o){
  matchSelections = {};
  const juices = shuffled(o.glands.map(g=>g.juice));
  const rows = o.glands.map(g=>`
    <div class="match-row">
      <div class="match-gland">${g.icon} ${g.gland}</div>
      <div class="match-opts">
        ${juices.map(j=>{
          const hint = state.hintActive && j === g.juice ? ' hint-glow' : '';
          return `<button class="match-opt${hint}" data-row="${g.gland}" data-val="${j}">${j}</button>`;
        }).join('')}
      </div>
    </div>`).join('');
  return `
  <div class="q-prompt">迷宮外的三座腺體要派出援軍！牠們藉由導管把消化液送進小腸。為每座腺體配對正確的消化液：</div>
  <div class="match-grid" id="matchGrid">${rows}</div>
  <button class="cast-btn" id="submitMatch" disabled>💉 注入膽汁與胰液！</button>`;
}

function siEnzymeHtml(o, nutrient){
  const correct = o.glands.filter(g=>g.enzymes.includes(nutrient)).map(g=>g.juice);
  const items = shuffled(o.glands.map(g=>({val:g.juice, label:`${g.icon} ${g.juice}`})));
  return `
  <div class="q-prompt">${monLabel(nutrient)}擋住了去路！三種消化液之中，哪幾種含有酵素，能對牠施展化學消化？（可複選）</div>
  ${pillsHtml('enzymeBox', items, correct)}
  <button class="cast-btn" id="submitEnzyme">🧪 釋放酵素攻擊！</button>`;
}

function nutritionLabelHtml(f){
  const row = (k,v,cls) => `<div class="nl-row ${cls||''}"><span>${k}</span><b>${v}</b></div>`;
  return `
  <div class="nlabel">
    <div class="nl-title">營養標示</div>
    ${row('每一份量', f.serving)}
    ${row('本包裝含', f.servings + ' 份', 'nl-servings')}
    <div class="nl-head"><span></span><span>每份</span></div>
    ${row('熱量', '？ 大卡', 'nl-kcal')}
    ${row('蛋白質', f.protein + ' 公克')}
    ${row('脂肪', f.fat + ' 公克')}
    ${row('碳水化合物', f.carbs + ' 公克')}
    ${row('鈉', f.sodium + ' 毫克', 'nl-last')}

  <div class="nl-note">營養標示上的「脂肪」就是脂質，「碳水化合物」就是醣類。</div>`;
}

function settleCalcHtml(f){
  const multi = !!f.servings;
  const d = state.calcDraft || {};
  const rows = state.settleItems.filter(it=>it.isEnergy).map(it=>`<tr><td>${it.name}</td><td>${it.amount}</td></tr>`).join('');
  const hintBox = state.hintActive
    ? `<div class="formula-box hint">💡 大賢者的卷軸：<b>${multi ? `(${formulaText(f)}) × ${f.servings} = ？` : `${formulaText(f)} = ？`}</b></div>` : '';
  const facts = multi ? nutritionLabelHtml(f) : `
  <table class="nutri-table">
    <thead><tr><th>能量素材</th><th>含量</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
  const formula = multi
    ? `煉金公式：<b>每份熱量 = (醣類克數 × 4) + (蛋白質克數 × 4) + (脂質克數 × 9)</b><br>再算：<b>總熱量 = 每份熱量 × 份數</b>`
    : `煉金公式：<b>(醣類克數 × 4) + (蛋白質克數 × 4) + (脂質克數 × 9)</b>`;
  const answer = multi ? `
    <div class="calc-section-sub">先算一份，再乘上份數：</div>
    <div class="calc-grid">
      <label for="kcalPer">① 每份熱量</label>
      <div class="calc-row"><input type="number" inputmode="numeric" id="kcalPer" placeholder="每份大卡數" value="${escapeHtml(d.per||'')}"><span class="unit">大卡</span></div>
      <label for="kcalInput">② 整份包裝總熱量（× ${f.servings} 份）</label>
      <div class="calc-row"><input type="number" inputmode="numeric" id="kcalInput" placeholder="總大卡數" value="${escapeHtml(d.total||'')}"><span class="unit">大卡</span></div>
    </div>
    <div class="btn-row"><button class="cast-btn danger" id="submitKcal">💎 煉化能量結晶！</button></div>` : `
    <div class="calc-section-sub">填入這道料理的總大卡數：</div>
    <div class="calc-row">
      <input type="number" inputmode="numeric" id="kcalInput" placeholder="總大卡數" value="${escapeHtml(d.total||'')}">
      <button class="cast-btn danger" id="submitKcal">💎 煉化能量結晶！</button>
    </div>`;
  return `
  <div class="food-hero">
    <h2>💎 煉化能量結晶</h2>
    <p>${multi ? `看懂「${f.name}」的營養標示，算出整份包裝的總熱量。` : `依照煉金公式，算出「${f.name}」的總熱量。`}</p>
  </div>
  ${facts}
  <div class="formula-box">${formula}</div>
  ${hintBox}
  <div class="calc-section">
    <div class="calc-section-title">📜 草稿卷軸</div>
    <div class="calc-section-sub">可以在這裡列式計算（不會被檢查）：</div>
    <textarea class="calc-scratch" rows="3" placeholder="例如：20 × 4 = 80 ..."></textarea>
  </div>
  <div class="calc-section answer-section">
    <div class="calc-section-title">🔥 熱量答案</div>
    ${answer}
  </div>
  <div id="settleFeedback"></div>`;
}

/* ---------- 結局 ---------- */
function cardHtml(card, opts){
  opts = opts || {};
  const locked = opts.locked;
  const name = locked ? '？？？' : card.name;
  const src = ASSETS.cards[card.id];
  const hasArt = src && !BAD_IMG.has(src);
  /* 有卡牌圖：整張卡完整顯示（卡框、等級、名稱都在圖裡），衛教說明放在下方；沒有圖：用文字版卡片 */
  const full = hasArt
    ? `<img class="pcard-full" src="${src}" alt="${locked ? '尚未獲得' : card.name}" onerror="BAD_IMG.add('${src}'); this.closest('.pcard').classList.remove('has-art'); this.remove();">`
    : '';
  const art = pic(null, card.emoji, 'pcard-art');
  return `
  <div class="pcard r-${card.rarity}${hasArt?' has-art':''}${locked?' locked':''}${opts.reveal?' reveal':''}" style="${opts.delay?`animation-delay:${opts.delay}s;`:''}">
    ${full}
    ${opts.isNew ? '<div class="pcard-new">NEW!</div>' : ''}
    ${opts.count ? `<div class="pcard-count">×${opts.count}</div>` : ''}
    <div class="pcard-rar">${RARITY_LABEL[card.rarity]}</div>
    ${art}
    <div class="pcard-name">${name}</div>
    ${locked ? '<div class="pcard-desc">尚未獲得</div>' : `<div class="pcard-desc">${card.desc}</div><div class="pcard-tip">${card.tip}</div>`}
  </div>`;
}

function endingHtml(tk){
  const e = state.ending;
  const titles = {S:'S 評價・完美攻略！', A:'A 評價・漂亮通關', B:'B 評價・勉強過關', C:'正確率不足 50%', X:'冒險失敗・生命耗盡'};
  const codex = loadCodex();
  const wait = introActive() ? (introUntil - Date.now())/1000 : 0;
  const cards = e.cards.map((c,i)=>cardHtml(c.card, {reveal:true, delay:wait + 0.3 + i*0.45, isNew:c.isNew, count:codex[c.card.id]})).join('');
  const buttons = e.type === 'gameover'
    ? `<button class="cast-btn danger" id="restartBtn">🔄 重新踏上冒險</button>`
    : `<button class="cast-btn" id="hallBtn">🏰 返回大廳，再次冒險</button>`;
  if(e.mode === 'warmup' && state.wu) return warmupEndingHtml(tk, e, cards, buttons);
  return `
  <div class="panel stage center">
    ${fxHtml(tk)}
    <div class="grade-badge grade-${e.grade}">${e.grade==='X'?'☠':e.grade}</div>
    <h2 class="ending-title">${titles[e.grade]}</h2>
    <div class="stat-row">
      <div class="stat"><b>${Math.round(e.acc*100)}%</b><span>正確率（${state.stats.correct}/${state.stats.total}）</span></div>
      <div class="stat"><b>${state.runEarned}</b><span>本次熱魔力</span></div>
      ${LAB_MODES.includes(e.mode) && state.lab ? `
      <div class="stat"><b>${state.lab.stars.reduce((a,b)=>a+b,0)}/9</b><span>⭐ 星星</span></div>
      <div class="stat"><b>${state.lab.mistakes}</b><span>失誤次數</span></div>` : e.mode === 'warmup' && state.wu ? `
      <div class="stat"><b>${fmtTime(state.wu.timeSec)}</b><span>暖身成績（含失誤 +${WU_PENALTY_SEC} 秒×${state.wu.mistakes}）</span></div>
      <div class="stat"><b>${state.wu.stars.reduce((a,b)=>a+b,0)}/12</b><span>⭐ 星星</span></div>` : `
      <div class="stat"><b>${state.stats.speed}</b><span>速攻次數</span></div>
      <div class="stat"><b>${state.clearedFoods.length}/${DISHES_PER_RUN}</b><span>淨化料理</span></div>`}
    </div>
    ${e.urUnlocked ? '<div class="ur-banner">🌈 五界制霸達成！五條修行之路全部通關，獲得 UR 卡！</div>' : ''}
    <div class="drop-title">— 掉落的便便卡 —</div>
    <div class="drop-row">${cards}</div>
    <div class="btn-row">
      ${buttons}
      <button class="cast-btn ghost" id="codexBtn2">📖 查看便便圖鑑</button>
      <button class="cast-btn ghost" id="leaderBtn2">🏆 查看排行榜</button>
    </div>
    <div class="upload-status ${state.uploadStatus==='ok'?'ok':state.uploadStatus==='fail'?'fail':''}" id="uploadStatus">${UPLOAD_TEXT[state.uploadStatus] || ''}</div>
  </div>`;
}

function warmupEndingHtml(tk, e, cards, buttons){
  const w = state.wu;
  const rows = WU_NAMES.map((n,i)=>`<tr><td>${i+1}. ${n}</td><td class="stars">${'⭐'.repeat(w.stars[i]||0)}${'☆'.repeat(3-(w.stars[i]||0))}</td><td>${w.stMistakes[i]} 次</td></tr>`).join('');
  const totalStars = w.stars.reduce((a,b)=>a+b,0);
  return `
  <div class="panel stage center">

      <tfoot><tr><td>合計</td><td>⭐ ${totalStars} / 12</td><td>${w.mistakes} 次</td></tr></tfoot>
    </table>
    <div class="stat-row">
      <div class="stat"><b>${fmtTime(w.timeSec)}</b><span>暖身成績（實際 ${fmtTime(w.rawSec)}＋失誤 ${w.mistakes}×${WU_PENALTY_SEC} 秒）</span></div>
      <div class="stat"><b>${Math.round(e.acc*100)}%</b><span>正確率（${state.stats.correct}/${state.stats.total}）</span></div>
      <div class="stat"><b>${state.runEarned}</b><span>本次熱魔力</span></div>

    ${e.urUnlocked ? `<div class="ur-banner">🌈 五界制霸達成！五條修行之路全部通關，獲得 UR 卡！</div><div class="drop-row" style="margin-top:12px">${cards}</div>` : ''}
    <div class="btn-row">
      ${buttons}
      <button class="cast-btn ghost" id="leaderBtn2">🏆 查看排行榜</button>
    </div>
    <div class="upload-status ${state.uploadStatus==='ok'?'ok':state.uploadStatus==='fail'?'fail':''}" id="uploadStatus">${UPLOAD_TEXT[state.uploadStatus] || ''}</div>

}

/* ---------- 拖曳（滑鼠、觸控都可）＋點選模式 ---------- */
let dragCtx = null;
function wuPointerDown(e){
  const el = e.currentTarget;
  if(e.button !== undefined && e.button !== 0) return;
  if(el.classList.contains('disabled')) return;
  e.preventDefault();
  const r = el.getBoundingClientRect();
  dragCtx = {el, id:el.dataset.drag, mode:el.dataset.dragmode || 'clone', sx:e.clientX, sy:e.clientY,
    ox:e.clientX - r.left, oy:e.clientY - r.top, w:r.width, h:r.height, clone:null, moved:false, hover:null};
  window.addEventListener('pointermove', wuPointerMove);
  window.addEventListener('pointerup', wuPointerUp);
  window.addEventListener('pointercancel', wuPointerCancel);
}
function wuDropAt(x, y){
  const t = document.elementFromPoint(x, y);
  return t ? t.closest('[data-drop]') : null;
}
function wuPointerMove(e){
  const c = dragCtx; if(!c) return;
  if(!c.moved){
    if(Math.hypot(e.clientX - c.sx, e.clientY - c.sy) < 6) return;
    c.moved = true;
    wuSel = null; document.querySelectorAll('.wu-selected').forEach(n=>n.classList.remove('wu-selected'));
    if(c.mode === 'clone'){
      c.clone = c.el.cloneNode(true);
      c.clone.classList.add('drag-clone');
      c.clone.style.width = c.w + 'px'; c.clone.style.height = c.h + 'px';
      document.body.appendChild(c.clone);
      c.el.classList.add('drag-src');
    }
    wuOnDragStart(c.id);
  }
  if(c.clone){
    c.clone.style.left = (e.clientX - c.ox) + 'px';
    c.clone.style.top = (e.clientY - c.oy) + 'px';
  }
  if(c.mode === 'line') wuDrawTempLine(c.el, e.clientX, e.clientY);
  const t = wuDropAt(e.clientX, e.clientY);
  if(t !== c.hover){
    if(c.hover) c.hover.classList.remove('drop-hover');
    if(t) t.classList.add('drop-hover');
    c.hover = t;
  }
  /* 只有手指「往邊緣移動」超過 80px 後才自動捲動，避免一開始拖就把畫面捲走 */
  if(e.clientY < 50 && c.sy - e.clientY > 80) window.scrollBy(0, -12);
  else if(e.clientY > window.innerHeight - 50 && e.clientY - c.sy > 80) window.scrollBy(0, 12);
}
function wuCleanupDrag(){
  window.removeEventListener('pointermove', wuPointerMove);
  window.removeEventListener('pointerup', wuPointerUp);
  window.removeEventListener('pointercancel', wuPointerCancel);
  const c = dragCtx; dragCtx = null;
  if(!c) return null;
  if(c.clone) c.clone.remove();
  if(c.el) c.el.classList.remove('drag-src');
  if(c.hover) c.hover.classList.remove('drop-hover');
  wuDrawTempLine(null);
  return c;
}
function wuPointerUp(e){
  const c = wuCleanupDrag(); if(!c) return;
  if(!c.moved){
    // 點一下：選取，或把已選取的東西放到這裡
    const dropHere = c.el.dataset.drop ? c.el : c.el.closest('[data-drop]');
    if(wuSel && wuSel !== c.id && dropHere){ const id = wuSel; wuSel = null; wuDrop(id, dropHere.dataset.drop); return; }
    wuSel = (wuSel === c.id) ? null : c.id;
    document.querySelectorAll('.wu-selected').forEach(n=>n.classList.remove('wu-selected'));
    if(wuSel) c.el.classList.add('wu-selected');
    wuOnDragEnd(c.id);

  }
  wuOnDragEnd(c.id);

}

/* ---------- 放下時的判斷 ---------- */
function wuDrop(id, target){

/* 第 1 站：鋪設通道 */
function wuS1Drop(id, target){
  const s = state.wu.s1; if(s.running || !id.startsWith('tile:')) return;
  const name = id.slice(5);
  const from = s.slots.indexOf(name);           // -1 表示在托盤
  if(target === 'tray'){
    if(from >= 0 && !s.locked[from]){ s.slots[from] = null; s.tray.push(name); }
    s.bad = []; wuRender(); return;
  }
  if(!target.startsWith('slot:')) return;
  const to = +target.slice(5);
  if(s.locked[to] || from === to) return;
  const occupant = s.slots[to];
  if(from >= 0){ s.slots[from] = occupant; }
  else { s.tray = s.tray.filter(n=>n !== name); if(occupant) s.tray.push(occupant); }
  s.slots[to] = name;
  s.bad = [];
  wuRender();
}
function wuS1Go(){
  const s = state.wu.s1;
  if(s.running || s.slots.some(n=>!n)) return;
  s.running = true;
  wuRender();
  const wrong = s.slots.map((n,i)=> n !== WU_TRACT[i]);
  const firstWrong = wrong.indexOf(true);
  const stopAt = firstWrong < 0 ? 7 : firstWrong;
  let i = 0;
  const step = ()=>{
    document.querySelectorAll('.wu-food').forEach(f=>f.textContent='');
    if(i < stopAt){
      const f = document.getElementById('wuFood'+i); if(f) f.textContent = '🍙';
      i++; setTimeout(step, 320); return;
    }
    if(firstWrong >= 0){
      const slotEl = document.querySelector(`[data-drop="slot:${firstWrong}"]`);
      if(slotEl){ slotEl.classList.add('wu-stuck'); const f = document.getElementById('wuFood'+firstWrong); if(f) f.textContent = '💥'; }
      setTimeout(()=>{
        const name = s.slots[firstWrong];
        let newlyOk = 0;
        s.slots.forEach((n,k)=>{ if(!wrong[k] && !s.locked[k]){ s.locked[k] = true; newlyOk++; } });
        if(newlyOk) wuOk(newlyOk);
        const badIdx = [];
        s.slots.forEach((n,k)=>{ if(wrong[k]){ badIdx.push(k); s.tray.push(n); s.slots[k] = null; } });
        badIdx.forEach(()=>{ state.wu.mistakes++; state.wu.stMistakes[state.wu.station]++; });
        s.bad = badIdx;
        s.running = false;
        const msg = WU_GLANDS.includes(name)
          ? `食物卡在第 ${firstWrong+1} 格！「${name}」是消化腺，食物不會經過它。放對的石板已經固定，其他的退回去了。`
          : `食物卡在第 ${firstWrong+1} 格！順序不對喔。放對的石板已經固定，其他的退回去了。`;
        setWizard(msg, 'sad');
        wuRender();
      }, 700);
      return;
    }
    const last = document.getElementById('wuFood6'); if(last) last.textContent = '💩';
    let newlyOk = 0;
    s.locked.forEach((l,k)=>{ if(!l){ s.locked[k] = true; newlyOk++; } });
    if(newlyOk) wuOk(newlyOk);
    setTimeout(()=>{ s.running = false; wuStationDone('通道打通了！食物從口腔一路滑到肛門，順利排出～'); }, 900);
  };
  step();
}

/* 第 2 站：點亮地圖 */
function wuS2Drop(id, target){

function wuS3Spawn(){
  const s = state.wu.s3;

function wuS3Loop(){

  const s = state.wu.s3;
  if(s.cur !== null){
    const now = performance.now();
    const elapsed = now - s.t0;
    const frac = Math.min(1, elapsed / s.dur);
    const sky = document.getElementById('wuSky'), card = document.getElementById('wuJob');
    if(sky && card){
      card.style.top = (frac * Math.max(0, sky.clientHeight - card.offsetHeight)) + 'px';
    }
    const bar = document.getElementById('wuFall'); if(bar) bar.style.width = ((1-frac)*100) + '%';
    if(frac >= 1){
      s.deck.push(s.cur);
      wuBad('任務卡掉到地上了！要在卡片掉到底之前派出去喔。');
      wuS3Spawn();

/* 人體消化酵素最適溫度約 37 °C；超過後活性快速下降，約 40～50 °C 以上會變性且無法恢復；低溫只是暫時變慢 */
const WU_DENATURE_AT = 50;
function enzymeActivity(T){ return T <= 37 ? Math.exp(-Math.pow((T-37)/14, 2)) : Math.exp(-Math.pow((T-37)/5.5, 2)); }
function wuTempUpdate(T){
  const s = state.wu.s4;
  s.temp = T;
  if(T >= WU_DENATURE_AT) s.denatured = true;
  const act = s.denatured ? 0 : enzymeActivity(T);
  let face, msg;
  if(s.denatured){ face = '🫠'; msg = '酵素「變性」了！高溫破壞了它的形狀，就算降溫也救不回來。'; }
  else if(T < 15){ face = '🥶'; msg = '好冷……動作變得好慢（回溫後就能恢復）'; }
  else if(T < 30){ face = '🙂'; msg = '慢慢暖起來了，開始有點力氣。'; }
  else if(T < 36){ face = '😊'; msg = '越來越有精神了，再暖一點點！'; }
  else if(T <= 38){ face = '🤩'; msg = '活力全開！'; }
  else if(T <= 43){ face = '😓'; msg = '有點太熱了，活力開始下降……'; }
  else { face = '🥵'; msg = '好燙！再熱下去就要變性了！'; }
  const set = (id, fn)=>{ const el = document.getElementById(id); if(el) fn(el); };
  set('wuTempVal', el=>el.textContent = T + ' °C');
  set('wuEnz', el=>{ el.textContent = face; el.style.transform = `scale(${0.8 + act*0.5})`; });
  set('wuEnzMsg', el=>el.textContent = msg);
  set('wuAct', el=>el.style.width = Math.round(act*100) + '%');
  set('wuTempReset', el=>el.style.display = (s.denatured && WU_TEMP_ROUNDS[s.tRound] && WU_TEMP_ROUNDS[s.tRound].title !== '高溫') ? '' : 'none');
}

/* 管線繪製 */
function wuCenter(el, box){ const r = el.getBoundingClientRect(); return {x:r.left + r.width/2 - box.left, y:r.top + r.height/2 - box.top, l:r.left - box.left, r:r.right - box.left}; }
function wuPipePath(a, b){
  const x1 = a.r, y1 = a.y, x2 = b.l - 10, y2 = b.y, mx = (x1 + x2)/2;
  return `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
}
function wuDrawPipes(){
  const box = document.getElementById('wuPipes'), svg = document.getElementById('wuPipeSvg');
  if(!box || !svg) return;
  const b = box.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${b.width} ${b.height}`);
  const color = from => (WU_SOURCES.find(x=>x.juice===from || x.gland===from) || {color:'#9bd65a'}).color;
  const colors = [...new Set([...WU_SOURCES.map(x=>x.color), '#9bd65a', '#fff3c4'])];
  const defs = '<defs>' + colors.map(c=>`<marker id="ah${c.slice(1)}" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`).join('') + '</defs>';
  const s4 = state.wu.s4;
  const paths = s4.conns.map(k=>{
    const [from, to] = k.split('>');
    const a = document.getElementById('wn-'+from), c = document.getElementById('wn-'+to);
    if(!a || !c) return '';
    const col = color(from), d = wuPipePath(wuCenter(a,b), wuCenter(c,b));
    const drop = k === s4.lastConn
      ? `<circle r="7" fill="${col}" stroke="#fff" stroke-width="2"><animateMotion dur="0.9s" repeatCount="1" fill="freeze" path="${d}"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.85;1" dur="0.9s" fill="freeze"/></circle>` : '';
    const A = wuCenter(a,b), C = wuCenter(c,b), mx = (A.r + C.l - 10)/2, my = (k === '膽汁>膽囊' ? C.y - 34 : (A.y + C.y)/2), verb = wuPipeVerb(k);
    const tw = verb.length * 13 + 12;
    const tag = `<g class="wu-pipe-tag"><rect x="${mx - tw/2}" y="${my - 11}" width="${tw}" height="22" rx="11" fill="#1d1518" stroke="${col}" stroke-width="1.5"/><text x="${mx}" y="${my + 5}" text-anchor="middle" fill="#fff3dc">${verb}</text></g>`;
    return `<path d="${d}" stroke="${col}" class="wu-pipe" marker-end="url(#ah${col.slice(1)})"/>${drop}${tag}`;
  }).join('');
  s4.lastConn = null;
  svg.innerHTML = defs + paths + '<path id="wuTempPipe" class="wu-pipe temp" d="" marker-end="url(#ahfff3c4)"/>';
}
function wuDrawTempLine(el, x, y){
  const p = document.getElementById('wuTempPipe'), box = document.getElementById('wuPipes');
  if(!p || !box) return;
  if(!el){ p.setAttribute('d',''); return; }
  const b = box.getBoundingClientRect(), a = wuCenter(el, b);
  p.setAttribute('d', wuPipePath(a, {l:x - b.left + 10, y:y - b.top}));
}

/* 事件綁定（在 bindEvents 裡呼叫） */
function wuBind(){
  if(state.screen !== 'warmup') return;
  document.querySelectorAll('[data-drag]').forEach(el=>el.addEventListener('pointerdown', wuPointerDown));
  document.querySelectorAll('[data-drop]').forEach(el=>el.addEventListener('click', wuTargetClick));
  on('wuGo', wuS1Go);
  on('wuNext', wuNext);
  on('wuBegin', wuBegin);
  document.querySelectorAll('[data-member]').forEach(b=>b.addEventListener('click', ()=>{ const s = state.wu.s3; if(s.cur !== null) wuS3Drop('job:'+s.cur, 'member:'+b.dataset.member); }));
  on('wuPhGo', wuPhGo);
  on('wuTempGo', wuTempGo);
  on('wuTempReset', wuTempReset);
  on('wuDigestGo', wuDigestGo);
  document.querySelectorAll('[data-dg]').forEach(b=>b.addEventListener('click', ()=>wuDigestToggle(b.dataset.dg)));
  document.querySelectorAll('[data-topt]').forEach(b=>b.addEventListener('click', ()=>wuTempPick(+b.dataset.topt)));
  document.querySelectorAll('.wu-ph').forEach(r=>r.addEventListener('input', ()=>{
    const v = +r.value; state.wu.s4.ph[r.dataset.ph] = v;
    const lab = document.getElementById('phv-'+r.dataset.ph); if(lab) lab.textContent = phClass(v);
  }));
  const t = document.getElementById('wuTemp');
  if(t){ t.addEventListener('input', ()=>wuTempUpdate(+t.value)); wuTempUpdate(state.wu.s4.temp); }
  if(document.getElementById('wuPipes')) wuDrawPipes();
  state.wu.flash = null;
}

function startLab(mode){
  stopTimer();
  state.difficulty = mode;
  state.screen = 'lab';
  state.stats = {correct:0, total:0, speed:0};
  state.runEarned = 0; state.ending = null; state.clearedFoods = []; state.uploadStatus = null;
  state.lab = labNew(mode);
  const d = LAB_DEF[mode];
  setWizard(`歡迎來到${d.title.slice(2)}！先看清楚規則，再開始挑戰。`, 'calm');
  render();
  showStageIntro(ASSETS.background[d.bg], d.kicker, d.title, d.stations.map(x=>x.name).join('・'));
}
function labSt(){ return state.lab.station; }

/* 一題的作答：第一次作答才列入正確率 */
function labAnswer(ok, hint){
  const L = state.lab;
  if(!L.qWrong){ L.total++; if(ok) L.correct++; }
  if(ok){ L.qWrong = false; earn(WU_POINT); return true; }
  L.qWrong = true; L.mistakes++; L.stMistakes[L.station]++;
  openWrongModal('', 'labRetry', hint, {hideAnswer:true, noHp:true});
  return false;
}
/* 多個小項目一起送出（例如 4 支試管）：每一項各自算一題，只算第一次作答 */
function labItems(items, hint){
  const L = state.lab; L.tried = L.tried || {};
  items.forEach(it=>{ if(!L.tried[it.key]){ L.tried[it.key] = true; L.total++; if(it.ok) L.correct++; } });
  if(items.every(it=>it.ok)){ earn(WU_POINT * items.length); return true; }
  L.mistakes++; L.stMistakes[L.station]++;
  openWrongModal('', 'labRetry', hint, {hideAnswer:true, noHp:true});
  return false;
}
/* 操作步驟錯誤（例如沒加熱就觀察）：算失誤，但不算題目 */
function labStepMistake(hint){
  const L = state.lab; L.mistakes++; L.stMistakes[L.station]++;
  openWrongModal('', 'labRetry', hint, {hideAnswer:true, noHp:true});
}
function labStationDone(msg){
  const L = state.lab, m = L.stMistakes[L.station];
  L.stars[L.station] = m === 0 ? 3 : m <= 2 ? 2 : 1;
  earn(L.stars[L.station] * 10);
  L.between = true;
  setWizard(msg, 'happy');
  render();
}
function labNext(){
  const L = state.lab;
  L.between = false; L.station++; L.rules = true;
  if(L.station >= 3){ labFinish(); return; }
  setWizard('下一站！先看規則再開始。', 'calm');
  render(); window.scrollTo({top:0, behavior:'smooth'});
}
function labFinish(){
  const L = state.lab;
  state.stats = {correct:L.correct, total:L.total, speed:0};
  finishRun('clear');
  render();
}

/* ---------- 曲線圖（每個消化道一個色塊） ---------- */
function labGraph(curves, opts){
  opts = opts || {};
  const narrow = window.innerWidth < 640;   // 手機：圖畫窄一點、高一點，字才看得清楚
  const W = narrow ? 420 : 820, H = narrow ? 330 : 300, X0 = narrow ? 44 : 54, Y0 = 18, PH = narrow ? 262 : 230, BW = (W - X0 - 8) / 7;
  const y = v => Y0 + PH - v / 100 * PH;
  let g = '';
  LAB_ORGANS.forEach((o,i)=>{
    const x = X0 + i*BW, sel = opts.band === i, ok = opts.okBand === i;
    g += `<rect class="lg-band${opts.clickable?' click':''}${sel?' sel':''}${ok?' ok':''}" data-band="${i}" x="${x}" y="${Y0}" width="${BW}" height="${PH}" fill="${LAB_BAND_COLORS[i]}"/>`;
    g += `<line x1="${x}" y1="${Y0}" x2="${x}" y2="${Y0+PH}" class="lg-div"/>`;
    g += `<text x="${x+BW/2}" y="${Y0+PH+22}" text-anchor="middle" class="lg-organ">${o}</text>`;
  });
  g += `<line x1="${X0+7*BW}" y1="${Y0}" x2="${X0+7*BW}" y2="${Y0+PH}" class="lg-div"/>`;
  [0,50,100].forEach(v=>{ g += `<text x="${X0-8}" y="${y(v)+5}" text-anchor="end" class="lg-axis">${v}%</text><line x1="${X0}" y1="${y(v)}" x2="${X0+7*BW}" y2="${y(v)}" class="lg-grid"/>`; });
  g += `<text x="14" y="${Y0+PH/2}" transform="rotate(-90 14 ${Y0+PH/2})" text-anchor="middle" class="lg-axis">${opts.ylabel || '剩餘量'}</text>`;
  curves.forEach((c,k)=>{
    const off = (k - (curves.length-1)/2) * 3;
    const pts = [];
    c.seg.forEach((v,i)=>{
      const x = X0 + i*BW;
      if(v.length === 1){ pts.push([x, v[0]], [x+BW, v[0]]); }
      else if(v.length === 2){ pts.push([x, v[0]], [x+BW*0.25, v[0]], [x+BW*0.75, v[1]], [x+BW, v[1]]); }
      else { pts.push([x, v[0]], [x+BW*0.15, v[0]], [x+BW*0.45, v[1]], [x+BW*0.85, v[2]], [x+BW, v[2]]); }
    });
    const d = pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${(y(p[1])+off).toFixed(1)}`).join(' ');
    g += `<path d="${d}" fill="none" stroke="${c.color}" stroke-width="${c.hl?6:4}" stroke-linejoin="round" ${c.dash?'stroke-dasharray="9 7"':''} ${c.dim?'opacity="0.28"':''}/>`;
  });
  const legend = curves.map(c=>`<span class="lg-leg${c.dim?' dim':''}"><i style="background:${c.color};${c.dash?'background:repeating-linear-gradient(90deg,'+c.color+' 0 7px,transparent 7px 12px)':''}"></i>${c.name}</span>`).join('');
  return `<div class="lg-wrap"><div class="lg-legend">${legend}</div><svg class="lg-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg></div>`;
}

const T3_ABSORB_OPTS = ['被小腸的絨毛吸收，進入血液', '在大腸又被分解掉了', '又重新組合變回大分子', '直接從肛門排出體外'];
const T3_MOUTH_OPTS = ['唾液把澱粉分解成葡萄糖', '食物在口腔被咬碎就會變成葡萄糖', '口腔會吸收葡萄糖', '胃液流到口腔分解澱粉'];
function t3Steps(nut, round){
  const st = ['big','small'];
  if(round === 0) st.push('absorb');
  if(nut === '醣類') st.push('mouth');
  return st;
}
function t3Pick(v){ state.lab.t3.pick = v; render(); }
function t3Go(){
  const s = state.lab.t3, nut = s.order[s.round], info = SMALL_INFO[nut];
  if(s.pick === null){ setWizard('先選一個答案喔！', 'calm'); refreshWizardDom(); return; }
  const ans = {big:info.big, small:info.small, absorb:T3_ABSORB_OPTS[0], mouth:T3_MOUTH_OPTS[0]}[s.step];
  if(s.pick !== ans){
    const hint = {
      big:'看虛線「第一次下降」的位置：在口腔就下降的是澱粉；在胃開始下降的是蛋白質；到小腸才下降的是脂質。',
      small:'大分子分解後會變成對應的小分子：澱粉 → 葡萄糖、蛋白質 → 胺基酸、脂質 → 脂肪酸和甘油。',
      absorb:'小分子養分是在哪裡、透過什麼構造進入身體的？想想小腸的皺褶和絨毛。',
      mouth:'口腔裡有哪一種消化液，可以進行化學消化？'
    }[s.step];
    labAnswer(false, hint); return;
  }
  labAnswer(true);
  const steps = t3Steps(nut, s.round);
  const i = steps.indexOf(s.step);
  s.pick = null;
  if(i < steps.length - 1){ s.step = steps[i+1]; setWizard('答對了！再回答下一個問題。', 'happy'); render(); return; }
  s.round++; s.step = 'big';
  if(s.round >= 3){ labStationDone('反向判讀完成！小分子在小腸被分解出來，又被小腸的絨毛吸收，所以曲線最後會下降。'); return; }
  setWizard('答對了！來看下一張圖。', 'happy'); render();
}

    return `
    <div class="wu-title">🔄 第 3 站：反向判讀 <small class="lab-prog">第 ${s.round+1} / 3 張圖</small></div>
    ${labGraph(curves, {ylabel:'相對量'})}
    <div class="wu-tq">${qText}</div>
    <div class="wu-topts">${order.map(o=>`<button class="wu-topt${s.pick===o?' on':''}" data-t3="${o}">${s.pick===o?'✅':'⬜'} ${o}${s.step==='small'?' '+labSmallPic(o):''}</button>`).join('')}</div>
    <div class="btn-row"><button class="cast-btn" id="t3Go">🔬 確認答案！</button></div>`;
}
function labSmallPic(name){
  const n = LAB_NUT.find(k=>SMALL_INFO[k].small === name); if(!n) return '';
  const i = SMALL_INFO[n];
  return pic(ASSETS.molecules[i.key], i.emoji, 'lab-mol');
}
function labShuffleFixed(arr, seed){ const a = [...arr]; for(let i=a.length-1;i>0;i--){ seed = (seed*9301+49297)%233280; const j = Math.floor(seed/233280*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

/* ---------- 試管繪製 ---------- */

      <rect x="14" y="4" width="32" height="8" rx="3" fill="#8c7a5e"/>
      <path d="M18 12 L18 128 A12 12 0 0 0 42 128 L42 12 Z" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>

      ${opts.bubbles ? '<circle cx="26" cy="110" r="2.5" fill="rgba(255,255,255,0.6)" class="lab-bub"/><circle cx="34" cy="96" r="2" fill="rgba(255,255,255,0.5)" class="lab-bub b2"/>' : ''}

}
function tubeCardHtml(t, color, extra, opts){
  return `<div class="lab-tcard">${tubeSvg(color, t.id, opts)}
    <div class="lab-tinfo"><b>澱粉液 ＋ ${t.add}</b><small>${t.env}</small></div>${extra||''}</div>`;
}

/* ---------- 魔藥學 第 1、2 站：碘液／本氏液 ---------- */
const P1_QS = [
  {q:'為什麼甲管不會變成藍黑色？', opts:['唾液中的酵素把澱粉分解了','碘液在溫水中失效了','溫水把澱粉沖淡了','甲管沒有加入澱粉液'], hint:'碘液遇到什麼才會變藍黑色？甲管和乙管差在哪裡？'},
  {q:'乙管（加清水）在實驗中的作用是什麼？', opts:['對照組：用來比較有沒有唾液的差別','實驗組：用來證明清水能分解澱粉','用來測試碘液的溫度','沒有作用，可以省略'], hint:'乙管只把唾液換成清水，其他條件都一樣。這種用來「比較」的試管叫做什麼？'}
];
const P2_QS = [
  {q:'丁管（煮沸過的唾液）為什麼和乙管結果一樣？', opts:['高溫使唾液中的酵素變性，失去作用','煮沸讓唾液變成清水','煮沸讓澱粉消失了','本氏液在高溫下失效'], hint:'酵素遇到高溫會發生什麼事？降溫後還能恢復嗎？'},
  {q:'丙管（冰水）為什麼只出現黃綠色？', opts:['低溫使酵素活性降低，分解得比較少','低溫讓酵素完全死掉','冰水把葡萄糖凍住了','冰水裡沒有澱粉'], hint:'低溫會破壞酵素嗎？還是只會讓它變慢？'}
];
function pState(){ return labSt() === 0 ? state.lab.p1 : state.lab.p2; }
function pAns(t){ return labSt() === 0 ? t.iodine : t.benedict; }
function pOpts(){ return labSt() === 0 ? IODINE_OPTS : BENEDICT_OPTS; }
function pColors(){ return labSt() === 0 ? IODINE_COLORS : BENEDICT_COLORS; }
function pQs(){ return labSt() === 0 ? P1_QS : P2_QS; }
function pStep(step){
  const s = pState();
  if(labSt() === 0 && step === 'wait' && s.step === 'setup'){ s.step = 'waiting'; render(); setTimeout(()=>{ if(state.lab && s.step === 'waiting'){ s.step = 'predict'; setWizard('10 分鐘到了！先預測：滴入碘液後，每一管會是什麼顏色？', 'calm'); render(); } }, 1800); return; }
  if(labSt() === 1){
    if(step === 'add' && s.step === 'add'){ s.step = 'added'; setWizard('本氏液加好了，現在四管都是藍色。接下來要怎麼做？', 'calm'); render(); return; }
    if(step === 'look' && s.step === 'added'){ labStepMistake('本氏液必須「隔水加熱」，才會和葡萄糖反應變色喔！直接看是看不出差別的。'); return; }
    if(step === 'heat' && s.step === 'added'){ s.step = 'heating'; render(); setTimeout(()=>{ if(state.lab && s.step === 'heating'){ s.step = 'predict'; setWizard('加熱中……先預測：加熱後每一管會是什麼顏色？', 'calm'); render(); } }, 1800); return; }
  }
}
function pPred(id, c){ const s = pState(); if(s.ok[id] || s.step !== 'predict') return; s.pred[id] = c; render(); }
function pPredGo(){
  const s = pState();
  if(POTION_TUBES.some(t=>!s.ok[t.id] && !s.pred[t.id])){ setWizard('四支試管都要預測喔！', 'calm'); refreshWizardDom(); return; }
  const wrong = POTION_TUBES.filter(t=>!s.ok[t.id] && s.pred[t.id] !== pAns(t));
  const items = POTION_TUBES.filter(t=>!s.ok[t.id]).map(t=>({key:'p'+labSt()+':'+t.id, ok:!wrong.includes(t)}));
  POTION_TUBES.forEach(t=>{ if(!wrong.includes(t)) s.ok[t.id] = true; });
  if(!wrong.length){
    labItems(items); s.step = 'reveal';
    setWizard(labSt() === 0 ? '預測完全正確！看看滴入碘液後的結果。' : '預測完全正確！看看加熱後的結果。', 'happy');
    render(); setTimeout(()=>{ if(state.lab && s.step === 'reveal'){ s.step = 'qa'; render(); } }, 1600);
    return;
  }
  const iod = {'甲':'甲管：唾液在 37 °C 時，能把澱粉分解多少？', '乙':'乙管：清水能分解澱粉嗎？', '丙':'丙管：低溫時唾液還有作用嗎？是全部分解、完全沒分解，還是分解得比較少？', '丁':'丁管：煮沸過的唾液還能分解澱粉嗎？'};
  const ben = {'甲':'甲管：澱粉被分解成葡萄糖了嗎？量多還是量少？', '乙':'乙管：沒有唾液，會產生葡萄糖嗎？', '丙':'丙管：低溫時酵素活性降低，產生的葡萄糖是多還是少？', '丁':'丁管：酵素變性後，還能產生葡萄糖嗎？'};
  labItems(items, (labSt() === 0 ? '碘液遇到澱粉會變藍黑色。' : '本氏液加熱後，葡萄糖越多顏色越偏磚紅色。') + '<br>' + wrong.map(t=>(labSt()===0?iod:ben)[t.id]).join('<br>'));
}
function pQPick(o){ pState().pick = o; render(); }
function pQGo(){
  const s = pState(), qs = pQs(), q = qs[s.q];
  if(s.pick === null){ setWizard('先選一個答案喔！', 'calm'); refreshWizardDom(); return; }
  if(s.pick !== q.opts[0]){ labAnswer(false, q.hint); return; }
  labAnswer(true); s.q++; s.pick = null;
  if(s.q >= qs.length){ labStationDone(labSt() === 0 ? '碘液檢驗完成！碘液可以檢驗「澱粉」還在不在。' : '本氏液檢驗完成！本氏液隔水加熱後，可以檢驗有沒有「葡萄糖」。'); return; }
  setWizard('答對了！下一題。', 'happy'); render();
}
function potionTestHtml(){
  const st = labSt(), s = pState(), colors = pColors();
  const isI = st === 0;
  let tubeColor = t => isI ? (['reveal','qa'].includes(s.step) ? colors[t.iodine] : '#e9e4d8')
                           : (['added','heating','predict'].includes(s.step) ? colors['藍色'] : ['reveal','qa'].includes(s.step) ? colors[t.benedict] : '#e9e4d8');
  const showPred = s.step === 'predict';
  const tubes = POTION_TUBES.map(t=>{
    const extra = showPred ? `<div class="lab-chips col">${pOpts().map(c=>`<button class="lab-chip sw${s.pred[t.id]===c?' on':''}" data-pp="${t.id}|${c}" ${s.ok[t.id]?'disabled':''}><i style="background:${colors[c]}"></i>${c}</button>`).join('')}</div>${s.ok[t.id]?'<div class="lab-ok">✅</div>':''}`
      : ['reveal','qa'].includes(s.step) ? `<div class="lab-result">${pAns(t)}<small>${isI ? IODINE_HINT[pAns(t)] : BENEDICT_HINT[pAns(t)]}</small></div>` : '';
    return tubeCardHtml(t, tubeColor(t), extra, {bubbles: s.step === 'waiting' || s.step === 'heating', cls: ['waiting','heating'].includes(s.step) ? 'shake' : '', k:st});
  }).join('');
  let ctrl = '';
  if(isI && s.step === 'setup') ctrl = `<div class="wu-tq">四支試管都準備好了，放置 10 分鐘讓唾液作用。</div><div class="btn-row"><button class="cast-btn" data-pstep="wait">⏳ 放置 10 分鐘</button></div>`;
  else if(s.step === 'waiting') ctrl = `<div class="wu-tq center">⏳ 等待中……</div>`;
  else if(!isI && s.step === 'add') ctrl = `<div class="wu-tq">取同樣的四管溶液（都已放置 10 分鐘），先加入本氏液。</div><div class="btn-row"><button class="cast-btn" data-pstep="add">🔵 加入本氏液</button></div>`;
  else if(!isI && s.step === 'added') ctrl = `<div class="wu-tq">本氏液加好了，下一步要怎麼做？</div><div class="btn-row"><button class="cast-btn" data-pstep="heat">🔥 隔水加熱</button><button class="cast-btn ghost" data-pstep="look">👀 直接觀察顏色</button></div>`;
  else if(s.step === 'heating') ctrl = `<div class="wu-tq center">🔥 隔水加熱中……</div>`;
  else if(showPred) ctrl = `<div class="wu-tq">❓ 預測：${isI ? '滴入碘液後' : '隔水加熱後'}，每一管會變成什麼顏色？</div><div class="btn-row"><button class="cast-btn" id="pPredGo">🔮 確認預測</button></div>`;
  else if(s.step === 'reveal') ctrl = `<div class="wu-tq center">${isI ? '💧 滴入碘液……' : '✨ 顏色出現了……'}</div>`;
  else if(s.step === 'qa'){
    const q = pQs()[s.q];
    const order = labShuffleFixed(q.opts, st*7 + s.q + 3);
    ctrl = `<div class="wu-tq">❓ ${q.q}</div><div class="wu-topts">${order.map(o=>`<button class="wu-topt${s.pick===o?' on':''}" data-pq="${o}">${s.pick===o?'✅':'⬜'} ${o}</button>`).join('')}</div><div class="btn-row"><button class="cast-btn" id="pQGo">🔬 確認答案！</button></div>`;
  }
  return `
    <div class="wu-title">${isI ? '🟤 第 1 站：碘液檢驗' : '🔵 第 2 站：本氏液檢驗'}</div>
    <div class="wu-desc">${isI ? '碘液遇到澱粉會變成藍黑色；澱粉被分解後就不會變色。' : '本氏液原本是藍色，隔水加熱後，如果有葡萄糖會變色；葡萄糖越多，顏色越偏向磚紅色。'}</div>
    <div class="lab-bench">${tubes}</div>
    ${ctrl}`;
}

/* ---------- 魔藥學 第 3 站：忘記標號 ---------- */
function p3Pick(sample, id){ const s = state.lab.p3; if(s.ok[sample]) return; s.pick[sample] = id; render(); }
/* 乙（清水）和丁（煮過的唾液）結果完全相同：兩組都可以填乙或丁，但兩組不能填一樣的 */
function p3Match(i, pick){
  const s = state.lab.p3, id = s.order[i];
  if(id === '乙' || id === '丁') return pick === '乙' || pick === '丁';
  return pick === id;
}
function p3Go(){
  const s = state.lab.p3;
  if(s.order.some((_,i)=>!s.ok[i] && !s.pick[i])){ setWizard('每一組結果都要選出試管編號喔！', 'calm'); refreshWizardDom(); return; }
  const picks = s.order.map((_,i)=>s.pick[i]);
  const dup = picks.filter((p,i)=>picks.indexOf(p) !== i);
  const wrong = s.order.map((_,i)=>i).filter(i=>!s.ok[i] && (!p3Match(i, s.pick[i]) || dup.includes(s.pick[i])));
  const items = s.order.map((_,i)=>i).filter(i=>!s.ok[i]).map(i=>({key:'p3:'+i, ok:!wrong.includes(i)}));
  s.order.forEach((_,i)=>{ if(!wrong.includes(i)) s.ok[i] = true; });
  if(!wrong.length){ labItems(items); labStationDone('標籤全部找回來了！乙管（清水）和丁管（煮過的唾液）結果一模一樣：兩管的澱粉都沒有被分解。'); return; }
  let hint = '想想看：碘液藍黑色＝澱粉還在；本氏液磚紅色＝葡萄糖很多。丙管是「反應比較差」，顏色會介於中間。';
  if(dup.length) hint += '<br>每一支試管只會出現一次，不能有兩組選同一個編號喔！';
  labItems(items, hint);
}
function potionS3Html(){
  const s = state.lab.p3;
  /* 乙、丁結果相同：任一個選對都算對 */
  const samples = s.order.map((id,i)=>{
    const t = POTION_TUBES.find(x=>x.id===id), ok = s.ok[i];
    return `<div class="lab-tcard sample${ok?' ok':''}">
      <div class="lab-pair">${tubeSvg(IODINE_COLORS[t.iodine], '碘', {k:'s'+i})}${tubeSvg(BENEDICT_COLORS[t.benedict], '本氏', {k:'b'+i})}</div>
      <div class="lab-tinfo"><b>第 ${'ABCD'[i]} 組</b><small>碘液：${t.iodine}<br>本氏液：${t.benedict}</small></div>
      <div class="lab-chips">${POTION_TUBES.map(x=>`<button class="lab-chip${s.pick[i]===x.id?' on':''}" data-p3="${i}|${x.id}" ${ok?'disabled':''}>${x.id}</button>`).join('')}</div>
      ${ok?'<div class="lab-ok">✅</div>':''}
    </div>`;
  }).join('');
  const key = POTION_TUBES.map(t=>`<li><b>${t.id}</b>：澱粉液 ＋ ${t.add}，${t.env}</li>`).join('');
  return `
    <div class="wu-title">🏷️ 第 3 站：忘記標號</div>
    <div class="wu-desc">四組檢驗結果的標籤掉了！依照結果，選出每一組來自哪一支試管。（小提示：其中有兩組的結果一模一樣，想想看為什麼。）</div>
    <ul class="lab-key">${key}</ul>
    <div class="lab-bench">${samples}</div>
    <div class="btn-row"><button class="cast-btn" id="p3Go">🏷️ 確認配對！</button></div>`;
}

/* ---------- 共用畫面 ---------- */
function labHtml(tk){
  const L = state.lab, d = LAB_DEF[L.mode], st = L.station;
  const steps = d.stations.map((x,i)=>`<span class="wu-step ${i<st?'done':i===st?'on':''}">${i<st || (i===st && L.between) ? '⭐'.repeat(L.stars[i]||0) : (i+1)} ${x.name}</span>`).join('');
  const head = `<div class="wu-head"><div class="wu-steps">${steps}</div><div class="wu-meta"><span>❌ 失誤 <b>${L.mistakes}</b></span></div></div>`;
  let body;
  if(L.between){
    const last = st === 2;
    body = `<div class="wu-between center">
      <div class="big-icon">🏅</div>
      <h2 class="ending-title">第 ${st+1} 站「${d.stations[st].name}」完成！</h2>

      <div class="btn-row"><button class="cast-btn" id="labNext">${last ? '🏆 完成挑戰，領取獎勵！' : `➡️ 前往第 ${st+2} 站：${d.stations[st+1].name}`}</button></div>
    </div>`;
  } else if(L.rules){
    const r = d.stations[st];
    body = `<div class="wu-rules">
      <div class="wu-rules-kicker">第 ${st+1} 站・遊戲規則</div>
      <h2 class="wu-rules-title">${r.icon} ${r.name}</h2>
      <ol class="wu-rules-list">${r.rules.map(x=>`<li>${x}</li>`).join('')}</ol>
      <div class="wu-rules-how">🖐️ 操作方式：${r.how}</div>
      <div class="wu-rules-note">💡 答錯不會扣生命，但會影響星星和正確率；答錯要再試一次，答對才能前進。</div>
      <div class="btn-row"><button class="cast-btn" id="labBegin">▶️ 我看懂了，開始！</button></div>
    </div>`;
  } else {
    body = L.mode === 'tracker' ? [trackerS1Html, trackerS2Html, trackerS3Html][st]() : [potionTestHtml, potionTestHtml, potionS3Html][st]();
  }
  return `<div class="panel stage wu-panel">${fxHtml(tk)}${head}${body}</div>`;
}
function labBind(){
  if(state.screen !== 'lab') return;
  const L = state.lab;
  on('labBegin', ()=>{ L.rules = false; render(); });
  on('labNext', labNext);
  on('t1Go', t1Go); on('t2IdGo', t2IdGo); on('t2JuiceGo', t2JuiceGo); on('t3Go', t3Go);
  on('pPredGo', pPredGo); on('pQGo', pQGo); on('p3Go', p3Go);
  const each = (sel, fn) => document.querySelectorAll(sel).forEach(b=>b.addEventListener('click', ()=>fn(b)));
  each('[data-t1]', b=>{ const [n,k,o] = b.dataset.t1.split('|'); t1Pick(n,k,o); });
  each('[data-t2id]', b=>{ const [l,n] = b.dataset.t2id.split('|'); t2IdPick(l,n); });
  each('[data-t2j]', b=>t2Juice(b.dataset.t2j));
  each('.lg-band.click', b=>t2Band(+b.dataset.band));
  each('[data-t3]', b=>t3Pick(b.dataset.t3));
  each('[data-pstep]', b=>pStep(b.dataset.pstep));
  each('[data-pp]', b=>{ const [id,c] = b.dataset.pp.split('|'); pPred(id,c); });
  each('[data-pq]', b=>pQPick(b.dataset.pq));
  each('[data-p3]', b=>{ const [i,id] = b.dataset.p3.split('|'); p3Pick(+i,id); });
}
